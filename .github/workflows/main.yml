          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/java/com/instaguard/reelblocker/MainActivity.kt
          package com.instaguard.reelblocker

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.accessibility.AccessibilityManager
          import android.widget.Button
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var statusBadgeText: TextView
              private lateinit var statusSubtitleText: TextView
              private lateinit var openSettingsButton: Button

              private lateinit var switchMasterEnabled: Switch
              private lateinit var switchRedirectReelsToDm: Switch
              private lateinit var switchAllowSingleDmReel: Switch
              private lateinit var switchAllowSingleHomeReel: Switch

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  prefs = getSharedPreferences(ReelBlockerAccessibilityService.PREFS_NAME, Context.MODE_PRIVATE)

                  statusBadgeText = findViewById(R.id.tv_service_status_badge)
                  statusSubtitleText = findViewById(R.id.tv_service_status_subtitle)
                  openSettingsButton = findViewById(R.id.btn_open_accessibility_settings)

                  switchMasterEnabled = findViewById(R.id.switch_master_enabled)
                  switchRedirectReelsToDm = findViewById(R.id.switch_redirect_reels_to_dm)
                  switchAllowSingleDmReel = findViewById(R.id.switch_allow_single_dm_reel)
                  switchAllowSingleHomeReel = findViewById(R.id.switch_allow_single_home_reel)

                  switchMasterEnabled.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_MASTER_ENABLED, true)
                  switchRedirectReelsToDm.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_REDIRECT_REELS_TAB_TO_DM, true)
                  switchAllowSingleDmReel.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_ALLOW_SINGLE_DM_REEL, true)
                  switchAllowSingleHomeReel.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_ALLOW_SINGLE_HOME_REEL, true)

                  switchMasterEnabled.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_MASTER_ENABLED, isChecked).apply()
                      refreshServiceStatusUi()
                  }
                  switchRedirectReelsToDm.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_REDIRECT_REELS_TAB_TO_DM, isChecked).apply()
                  }
                  switchAllowSingleDmReel.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_ALLOW_SINGLE_DM_REEL, isChecked).apply()
                  }
                  switchAllowSingleHomeReel.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_ALLOW_SINGLE_HOME_REEL, isChecked).apply()
                  }

                  openSettingsButton.setOnClickListener {
                      val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK
                      }
                      startActivity(intent)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refreshServiceStatusUi()
              }

              private fun refreshServiceStatusUi() {
                  val serviceEnabled = isAccessibilityServiceEnabled()
                  val masterOn = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_MASTER_ENABLED, true)

                  when {
                      !serviceEnabled -> {
                          statusBadgeText.text = "ACTION REQUIRED: SERVICE OFF"
                          statusBadgeText.setTextColor(Color.parseColor("#FFB4AB"))
                          statusSubtitleText.text = "Tap the button below -> Installed Apps -> InstaReelGuard -> Turn ON."
                          openSettingsButton.text = "Enable in Accessibility Settings"
                      }
                      !masterOn -> {
                          statusBadgeText.text = "PAUSED BY USER"
                          statusBadgeText.setTextColor(Color.parseColor("#FFD580"))
                          statusSubtitleText.text = "Accessibility Service is connected, but Master Protection is switched off."
                          openSettingsButton.text = "Manage Accessibility Settings"
                      }
                      else -> {
                          statusBadgeText.text = "ACTIVE & PROTECTING INSTAGRAM"
                          statusBadgeText.setTextColor(Color.parseColor("#6DD58C"))
                          statusSubtitleText.text = "100% Local On-Device Engine • Zero Internet Permission • Zero Data Leaks"
                          openSettingsButton.text = "Open Accessibility Settings"
                      }
                  }
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  if (ReelBlockerAccessibilityService.isServiceCurrentlyRunning) return true
                  val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as? AccessibilityManager ?: return false
                  val enabledServices = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                  val expectedComponent = "$packageName/${ReelBlockerAccessibilityService::class.java.name}"
                  val expectedShortComponent = "$packageName/.${ReelBlockerAccessibilityService::class.java.simpleName}"
                  return enabledServices.any { info ->
                      val id = info.id ?: ""
                      id.equals(expectedComponent, ignoreCase = true) || id.equals(expectedShortComponent, ignoreCase = true)
                  }
              }
          }
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/java/com/instaguard/reelblocker/ReelBlockerAccessibilityService.kt
          package com.instaguard.reelblocker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Rect
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.ArrayDeque

          class ReelBlockerAccessibilityService : AccessibilityService() {

              companion object {
                  private const val INSTAGRAM_PACKAGE = "com.instagram.android"

                  const val PREFS_NAME = "instaguard_prefs"
                  const val KEY_MASTER_ENABLED = "master_enabled"
                  const val KEY_REDIRECT_REELS_TAB_TO_DM = "redirect_reels_tab_to_dm"
                  const val KEY_ALLOW_SINGLE_DM_REEL = "allow_single_dm_reel"
                  const val KEY_ALLOW_SINGLE_HOME_REEL = "allow_single_home_reel"

                  private val REELS_TAB_IDS = setOf("com.instagram.android:id/clips_tab")
                  private val HOME_TAB_IDS = setOf("com.instagram.android:id/feed_tab")
                  private val DM_BUTTON_IDS = setOf(
                      "com.instagram.android:id/action_bar_inbox_button",
                      "com.instagram.android:id/direct_tab",
                      "com.instagram.android:id/action_bar_wrapper_inbox_button"
                  )
                  private val DM_SCREEN_INDICATOR_IDS = setOf(
                      "com.instagram.android:id/row_thread_composer_edittext",
                      "com.instagram.android:id/row_thread_composer_button_send",
                      "com.instagram.android:id/direct_thread_content_below_action_bar",
                      "com.instagram.android:id/message_list",
                      "com.instagram.android:id/thread_list_recyclerview",
                      "com.instagram.android:id/direct_inbox_recycler_view"
                  )
                  private val CLIPS_FULLSCREEN_PAGER_IDS = setOf(
                      "com.instagram.android:id/clips_viewer_view_pager",
                      "com.instagram.android:id/clips_viewer_root"
                  )
                  private val STORY_VIEWER_IDS = setOf(
                      "com.instagram.android:id/reel_viewer_root",
                      "com.instagram.android:id/reel_viewer_image_view",
                      "com.instagram.android:id/story_viewer_container"
                  )
                  private val SAFE_SCROLL_CONTAINER_HINTS = listOf(
                      "comment",
                      "message_list",
                      "thread_list",
                      "direct_inbox",
                      "tray_recycler_view",
                      "bottom_sheet",
                      "share_sheet"
                  )

                  private const val EVENT_THROTTLE_MS = 85L
                  private const val ACTION_COOLDOWN_MS = 550L
                  private const val INITIAL_REEL_SETTLE_GRACE_MS = 450L
                  private const val ALLOWED_TAP_WINDOW_MS = 2800L
                  private const val DM_REDIRECT_TIMEOUT_MS = 1600L
                  private const val MAX_BFS_NODES = 90

                  @Volatile
                  var isServiceCurrentlyRunning: Boolean = false
                      private set
              }

              private enum class ScreenOrigin {
                  HOME_FEED,
                  DM_CHAT_OR_INBOX,
                  OTHER
              }

              private lateinit var prefs: SharedPreferences
              private val mainHandler = Handler(Looper.getMainLooper())

              private var lastOrigin: ScreenOrigin = ScreenOrigin.HOME_FEED
              private var inSingleReelSession: Boolean = false
              private var singleReelOpenedAtMs: Long = 0L
              private var initialReelSignature: String? = null
              private var initialPagerIndex: Int = -1

              private var lastAllowedContentTapAtMs: Long = 0L
              private var lastAllowedTapOrigin: ScreenOrigin = ScreenOrigin.HOME_FEED

              private var pendingClickDmInbox: Boolean = false
              private var pendingClickDmDeadlineMs: Long = 0L

              private var lastContentCheckAtMs: Long = 0L
              private var lastBlockActionAtMs: Long = 0L

              private val dmClickRetryRunnable = Runnable {
                  val now = SystemClock.elapsedRealtime()
                  if (pendingClickDmInbox && now < pendingClickDmDeadlineMs) {
                      val root = rootInActiveWindow ?: return@Runnable
                      if (tryClickDmButton(root)) {
                          pendingClickDmInbox = false
                          lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                      }
                  } else {
                      pendingClickDmInbox = false
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  isServiceCurrentlyRunning = true
                  prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

                  serviceInfo = serviceInfo.apply {
                      packageNames = arrayOf(INSTAGRAM_PACKAGE)
                      eventTypes = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED or
                              AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED or
                              AccessibilityEvent.TYPE_VIEW_CLICKED or
                              AccessibilityEvent.TYPE_VIEW_SCROLLED or
                              AccessibilityEvent.TYPE_VIEW_SELECTED
                      feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC
                      flags = AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS or
                              AccessibilityServiceInfo.FLAG_INCLUDE_NOT_IMPORTANT_VIEWS or
                              AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS
                      notificationTimeout = 70L
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg != INSTAGRAM_PACKAGE) return
                  if (!prefs.getBoolean(KEY_MASTER_ENABLED, true)) return

                  val now = SystemClock.elapsedRealtime()

                  if (event.eventType == AccessibilityEvent.TYPE_VIEW_CLICKED ||
                      event.eventType == AccessibilityEvent.TYPE_VIEW_SELECTED
                  ) {
                      if (isEventSourceReelsBottomTab(event)) {
                          handleReelsTabBlocked(now)
                          return
                      } else if (event.eventType == AccessibilityEvent.TYPE_VIEW_CLICKED) {
                          recordContentTapIfInAllowedOrigin(event, now)
                      }
                  }

                  if (event.eventType == AccessibilityEvent.TYPE_VIEW_SCROLLED && inSingleReelSession) {
                      handleScrollDuringSingleReelSession(event, now)
                  }

                  if (event.eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) {
                      if (now - lastContentCheckAtMs < EVENT_THROTTLE_MS) return
                      lastContentCheckAtMs = now
                  }

                  val root = rootInActiveWindow ?: return
                  evaluateScreenState(root, now)
              }

              private fun recordContentTapIfInAllowedOrigin(event: AccessibilityEvent, now: Long) {
                  if (lastOrigin != ScreenOrigin.DM_CHAT_OR_INBOX && lastOrigin != ScreenOrigin.HOME_FEED) {
                      return
                  }
                  val src = event.source ?: return
                  val rect = Rect()
                  src.getBoundsInScreen(rect)
                  val screenHeight = resources.displayMetrics.heightPixels

                  if (rect.bottom < (screenHeight * 0.88).toInt()) {
                      lastAllowedContentTapAtMs = now
                      lastAllowedTapOrigin = lastOrigin
                      lastBlockActionAtMs = 0L
                  }
              }

              private fun evaluateScreenState(root: AccessibilityNodeInfo, now: Long) {
                  val snapshot = inspectWindowHierarchy(root)

                  if (pendingClickDmInbox) {
                      if (now < pendingClickDmDeadlineMs) {
                          if (snapshot.dmButtonNode != null && clickNodeOrParent(snapshot.dmButtonNode)) {
                              pendingClickDmInbox = false
                              resetSingleReelSession()
                              lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                              return
                          }
                      } else {
                          pendingClickDmInbox = false
                      }
                  }

                  if (snapshot.isStoryViewerVisible) return

                  if (snapshot.isDmScreenVisible && !snapshot.isClipsViewerVisible) {
                      lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                      resetSingleReelSession()
                      return
                  }

                  if (snapshot.isClipsViewerVisible) {
                      val allowDmReel = prefs.getBoolean(KEY_ALLOW_SINGLE_DM_REEL, true)
                      val allowHomeReel = prefs.getBoolean(KEY_ALLOW_SINGLE_HOME_REEL, true)

                      val recentlyTappedFromAllowedOrigin = (now - lastAllowedContentTapAtMs) <= ALLOWED_TAP_WINDOW_MS
                      val effectiveOrigin = if (recentlyTappedFromAllowedOrigin) lastAllowedTapOrigin else lastOrigin

                      val isAllowedSingleReelOrigin =
                          (effectiveOrigin == ScreenOrigin.DM_CHAT_OR_INBOX && allowDmReel) ||
                          (effectiveOrigin == ScreenOrigin.HOME_FEED && allowHomeReel)

                      if (snapshot.isReelsTabSelected && !inSingleReelSession && !recentlyTappedFromAllowedOrigin) {
                          handleReelsTabBlocked(now, snapshot)
                          return
                      }

                      if (!isAllowedSingleReelOrigin) {
                          triggerBackAction(now)
                          return
                      }

                      if (!inSingleReelSession) {
                          inSingleReelSession = true
                          singleReelOpenedAtMs = now
                          initialReelSignature = snapshot.currentReelSignature
                          initialPagerIndex = -1
                      } else {
                          if (now - singleReelOpenedAtMs > INITIAL_REEL_SETTLE_GRACE_MS) {
                              val oldSig = initialReelSignature
                              val newSig = snapshot.currentReelSignature
                              if (oldSig == null && newSig != null) {
                                  initialReelSignature = newSig
                              } else if (oldSig != null && newSig != null && oldSig != newSig &&
                                  !snapshot.isCommentOrShareSheetOpen
                              ) {
                                  resetSingleReelSession()
                                  triggerBackAction(now)
                                  return
                              }
                          }
                      }
                      return
                  }

                  if (snapshot.isReelsTabSelected && !inSingleReelSession) {
                      handleReelsTabBlocked(now, snapshot)
                      return
                  }

                  if (snapshot.isHomeTabSelected && !snapshot.isClipsViewerVisible) {
                      lastOrigin = ScreenOrigin.HOME_FEED
                      resetSingleReelSession()
                      return
                  }

                  if (!snapshot.isClipsViewerVisible) {
                      lastOrigin = ScreenOrigin.OTHER
                      resetSingleReelSession()
                  }
              }

              private fun handleScrollDuringSingleReelSession(event: AccessibilityEvent, now: Long) {
                  val elapsedSinceOpen = now - singleReelOpenedAtMs
                  val sourceNode = event.source
                  val viewId = sourceNode?.viewIdResourceName?.lowercase() ?: ""
                  val className = event.className?.toString()?.lowercase() ?: ""

                  if (SAFE_SCROLL_CONTAINER_HINTS.any { viewId.contains(it) }) return

                  val isClipsPagerScroll = viewId.contains("clips_viewer") ||
                          viewId.contains("view_pager") ||
                          className.contains("viewpager") ||
                          className.contains("recyclerview")

                  if (!isClipsPagerScroll) return

                  val currentIndex = event.fromIndex

                  if (elapsedSinceOpen <= INITIAL_REEL_SETTLE_GRACE_MS) {
                      if (initialPagerIndex == -1 && currentIndex >= 0) {
                          initialPagerIndex = currentIndex
                      }
                      return
                  }

                  if (initialPagerIndex == -1 && currentIndex >= 0) {
                      initialPagerIndex = currentIndex
                  }

                  val indexAdvanced = (initialPagerIndex >= 0 && currentIndex >= 0 && currentIndex != initialPagerIndex) ||
                          (currentIndex >= 1)

                  val scrolledVertically = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      event.scrollDeltaY > 55
                  } else {
                      event.scrollY > 0
                  }

                  if (indexAdvanced || scrolledVertically) {
                      val root = rootInActiveWindow
                      if (root != null) {
                          val snap = inspectWindowHierarchy(root)
                          if (snap.isCommentOrShareSheetOpen) return
                      }
                      resetSingleReelSession()
                      triggerBackAction(now)
                  }
              }

              private fun handleReelsTabBlocked(now: Long, snapshot: WindowSnapshot? = null) {
                  if (now - lastBlockActionAtMs < ACTION_COOLDOWN_MS) return
                  lastBlockActionAtMs = now
                  resetSingleReelSession()
                  lastAllowedContentTapAtMs = 0L

                  val redirectToDm = prefs.getBoolean(KEY_REDIRECT_REELS_TAB_TO_DM, true)
                  val root = rootInActiveWindow

                  if (redirectToDm && root != null) {
                      val snap = snapshot ?: inspectWindowHierarchy(root)

                      if (snap.dmButtonNode != null && clickNodeOrParent(snap.dmButtonNode)) {
                          pendingClickDmInbox = false
                          lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                          return
                      }

                      if (snap.homeTabNode != null && clickNodeOrParent(snap.homeTabNode)) {
                          pendingClickDmInbox = true
                          pendingClickDmDeadlineMs = now + DM_REDIRECT_TIMEOUT_MS
                          mainHandler.removeCallbacks(dmClickRetryRunnable)
                          mainHandler.postDelayed(dmClickRetryRunnable, 160L)
                          mainHandler.postDelayed(dmClickRetryRunnable, 340L)
                          return
                      }
                  }

                  performGlobalAction(GLOBAL_ACTION_BACK)
              }

              private fun triggerBackAction(now: Long) {
                  if (now - lastBlockActionAtMs < ACTION_COOLDOWN_MS) return
                  lastBlockActionAtMs = now
                  lastAllowedContentTapAtMs = 0L
                  performGlobalAction(GLOBAL_ACTION_BACK)
              }

              private fun resetSingleReelSession() {
                  inSingleReelSession = false
                  singleReelOpenedAtMs = 0L
                  initialReelSignature = null
                  initialPagerIndex = -1
              }

              private fun isEventSourceReelsBottomTab(event: AccessibilityEvent): Boolean {
                  val src = event.source ?: return false
                  val id = src.viewIdResourceName ?: ""
                  if (id in REELS_TAB_IDS) return true

                  val desc = src.contentDescription?.toString()?.trim() ?: ""
                  if (desc.equals("Reels", ignoreCase = true)) {
                      val bounds = Rect()
                      src.getBoundsInScreen(bounds)
                      val displayHeight = resources.displayMetrics.heightPixels
                      if (bounds.top >= (displayHeight * 0.80).toInt()) {
                          return true
                      }
                  }
                  return false
              }

              private fun tryClickDmButton(root: AccessibilityNodeInfo): Boolean {
                  val snap = inspectWindowHierarchy(root)
                  return snap.dmButtonNode != null && clickNodeOrParent(snap.dmButtonNode)
              }

              private fun clickNodeOrParent(node: AccessibilityNodeInfo): Boolean {
                  var current: AccessibilityNodeInfo? = node
                  var depth = 0
                  while (current != null && depth < 4) {
                      if (current.isClickable) {
                          return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      }
                      current = current.parent
                      depth++
                  }
                  return false
              }

              private class WindowSnapshot(
                  val isReelsTabSelected: Boolean,
                  val isHomeTabSelected: Boolean,
                  val isDmScreenVisible: Boolean,
                  val isClipsViewerVisible: Boolean,
                  val isStoryViewerVisible: Boolean,
                  val isCommentOrShareSheetOpen: Boolean,
                  val homeTabNode: AccessibilityNodeInfo?,
                  val dmButtonNode: AccessibilityNodeInfo?,
                  val currentReelSignature: String?
              )

              private fun inspectWindowHierarchy(root: AccessibilityNodeInfo): WindowSnapshot {
                  var isReelsTabSelected = false
                  var isHomeTabSelected = false
                  var isDmScreenVisible = false
                  var isClipsViewerVisible = false
                  var isStoryViewerVisible = false
                  var isCommentOrShareSheetOpen = false
                  var homeTabNode: AccessibilityNodeInfo? = null
                  var dmButtonNode: AccessibilityNodeInfo? = null
                  var reelAuthorOrCaption: String? = null

                  val screenHeight = resources.displayMetrics.heightPixels
                  val screenWidth = resources.displayMetrics.widthPixels
                  val rect = Rect()

                  val queue = ArrayDeque<AccessibilityNodeInfo>(MAX_BFS_NODES)
                  queue.add(root)
                  var visited = 0

                  while (queue.isNotEmpty() && visited < MAX_BFS_NODES) {
                      val node = queue.removeFirst()
                      visited++

                      val viewId = node.viewIdResourceName ?: ""
                      val contentDesc = node.contentDescription?.toString()?.trim() ?: ""
                      val text = node.text?.toString()?.trim() ?: ""

                      if (viewId in STORY_VIEWER_IDS && node.isVisibleToUser) {
                          isStoryViewerVisible = true
                      }

                      if (viewId in REELS_TAB_IDS ||
                          (contentDesc.equals("Reels", ignoreCase = true) && isBottomBarPosition(node, rect, screenHeight))
                      ) {
                          if (node.isSelected) isReelsTabSelected = true
                      }

                      if (viewId in HOME_TAB_IDS ||
                          (contentDesc.equals("Home", ignoreCase = true) && isBottomBarPosition(node, rect, screenHeight))
                      ) {
                          if (homeTabNode == null) homeTabNode = node
                          if (node.isSelected) isHomeTabSelected = true
                      }

                      if (viewId in DM_BUTTON_IDS ||
                          (isTopRightPosition(node, rect, screenWidth, screenHeight) &&
                                  (contentDesc.contains("Direct", ignoreCase = true) ||
                                   contentDesc.contains("Messenger", ignoreCase = true) ||
                                   contentDesc.contains("message", ignoreCase = true)))
                      ) {
                          if (dmButtonNode == null && node.isVisibleToUser) dmButtonNode = node
                      }

                      if (node.isVisibleToUser &&
                          (viewId in DM_SCREEN_INDICATOR_IDS ||
                           viewId.contains("direct_thread", ignoreCase = true) ||
                           viewId.contains("row_thread_composer", ignoreCase = true))
                      ) {
                          isDmScreenVisible = true
                      }

                      if (node.isVisibleToUser &&
                          (viewId in CLIPS_FULLSCREEN_PAGER_IDS || viewId.contains("clips_viewer_view_pager"))
                      ) {
                          node.getBoundsInScreen(rect)
                          if (rect.height() >= (screenHeight * 0.72).toInt()) {
                              isClipsViewerVisible = true
                          }
                      }

                      if (reelAuthorOrCaption == null && node.isVisibleToUser) {
                          if (viewId.contains("clips_author_username") ||
                              viewId.contains("clips_author_info") ||
                              viewId.contains("clips_caption") ||
                              contentDesc.startsWith("Reel by ", ignoreCase = true)
                          ) {
                              val sig = if (text.isNotEmpty()) text else contentDesc
                              if (sig.isNotEmpty()) reelAuthorOrCaption = sig
                          }
                      }

                      if (node.isVisibleToUser &&
                          (viewId.contains("comment_list") ||
                           viewId.contains("layout_comment_thread") ||
                           viewId.contains("direct_share_sheet"))
                      ) {
                          isCommentOrShareSheetOpen = true
                      }

                      val childCount = node.childCount
                      for (i in 0 until childCount) {
                          if (visited + queue.size >= MAX_BFS_NODES) break
                          val child = node.getChild(i)
                          if (child != null) queue.add(child)
                      }
                  }

                  return WindowSnapshot(
                      isReelsTabSelected = isReelsTabSelected,
                      isHomeTabSelected = isHomeTabSelected,
                      isDmScreenVisible = isDmScreenVisible,
                      isClipsViewerVisible = isClipsViewerVisible,
                      isStoryViewerVisible = isStoryViewerVisible,
                      isCommentOrShareSheetOpen = isCommentOrShareSheetOpen,
                      homeTabNode = homeTabNode,
                      dmButtonNode = dmButtonNode,
                      currentReelSignature = reelAuthorOrCaption
                  )
              }

              private fun isBottomBarPosition(node: AccessibilityNodeInfo, rect: Rect, screenHeight: Int): Boolean {
                  node.getBoundsInScreen(rect)
                  return rect.top >= (screenHeight * 0.80).toInt()
              }

              private fun isTopRightPosition(
                  node: AccessibilityNodeInfo,
                  rect: Rect,
                  screenWidth: Int,
                  screenHeight: Int
              ): Boolean {
                  node.getBoundsInScreen(rect)
                  return rect.bottom <= (screenHeight * 0.18).toInt() && rect.left >= (screenWidth * 0.65).toInt()
              }

              override fun onInterrupt() {
                  resetSingleReelSession()
                  pendingClickDmInbox = false
                  mainHandler.removeCallbacks(dmClickRetryRunnable)
              }

              override fun onDestroy() {
                  isServiceCurrentlyRunning = false
                  resetSingleReelSession()
                  pendingClickDmInbox = false
                  mainHandler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
          EOF

          cd /tmp/InstaReelGuard
          gradle assembleRelease --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaReelGuard-APK
          path: /tmp/InstaReelGuard/app/build/outputs/apk/release/app-release.apk
