          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/java/com/instaguard/reelblocker/MainActivity.kt
          package com.instaguard.reelblocker

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.accessibility.AccessibilityManager
          import android.widget.Button
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var statusBadgeText: TextView
              private lateinit var statusSubtitleText: TextView
              private lateinit var openSettingsButton: Button

              private lateinit var switchMasterEnabled: Switch
              private lateinit var switchRedirectReelsToDm: Switch
              private lateinit var switchBlockExploreReels: Switch
              private lateinit var switchAllowSingleDmReel: Switch
              private lateinit var switchAllowSingleHomeReel: Switch
              private lateinit var switchFifteenMinTimer: Switch

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  prefs = getSharedPreferences(ReelBlockerAccessibilityService.PREFS_NAME, Context.MODE_PRIVATE)

                  statusBadgeText = findViewById(R.id.tv_service_status_badge)
                  statusSubtitleText = findViewById(R.id.tv_service_status_subtitle)
                  openSettingsButton = findViewById(R.id.btn_open_accessibility_settings)

                  switchMasterEnabled = findViewById(R.id.switch_master_enabled)
                  switchRedirectReelsToDm = findViewById(R.id.switch_redirect_reels_to_dm)
                  switchBlockExploreReels = findViewById(R.id.switch_block_explore_reels)
                  switchAllowSingleDmReel = findViewById(R.id.switch_allow_single_dm_reel)
                  switchAllowSingleHomeReel = findViewById(R.id.switch_allow_single_home_reel)
                  switchFifteenMinTimer = findViewById(R.id.switch_fifteen_min_timer)

                  switchMasterEnabled.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_MASTER_ENABLED, true)
                  switchRedirectReelsToDm.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_REDIRECT_REELS_TAB_TO_DM, true)
                  switchBlockExploreReels.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_BLOCK_EXPLORE_REELS, true)
                  switchAllowSingleDmReel.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_ALLOW_SINGLE_DM_REEL, true)
                  switchAllowSingleHomeReel.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_ALLOW_SINGLE_HOME_REEL, true)
                  switchFifteenMinTimer.isChecked = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_FIFTEEN_MIN_TIMER, true)

                  switchMasterEnabled.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_MASTER_ENABLED, isChecked).apply()
                      refreshServiceStatusUi()
                  }
                  switchRedirectReelsToDm.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_REDIRECT_REELS_TAB_TO_DM, isChecked).apply()
                  }
                  switchBlockExploreReels.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_BLOCK_EXPLORE_REELS, isChecked).apply()
                  }
                  switchAllowSingleDmReel.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_ALLOW_SINGLE_DM_REEL, isChecked).apply()
                  }
                  switchAllowSingleHomeReel.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_ALLOW_SINGLE_HOME_REEL, isChecked).apply()
                  }
                  switchFifteenMinTimer.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean(ReelBlockerAccessibilityService.KEY_FIFTEEN_MIN_TIMER, isChecked).apply()
                  }

                  openSettingsButton.setOnClickListener {
                      val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK
                      }
                      startActivity(intent)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refreshServiceStatusUi()
              }

              private fun refreshServiceStatusUi() {
                  val serviceEnabled = isAccessibilityServiceEnabled()
                  val masterOn = prefs.getBoolean(ReelBlockerAccessibilityService.KEY_MASTER_ENABLED, true)

                  when {
                      !serviceEnabled -> {
                          statusBadgeText.text = "ACTION REQUIRED: SERVICE OFF"
                          statusBadgeText.setTextColor(Color.parseColor("#FFB4AB"))
                          statusSubtitleText.text = "Tap the button below -> Downloaded Services -> InstaReelGuard -> Turn ON."
                          openSettingsButton.text = "Enable in Accessibility Settings"
                      }
                      !masterOn -> {
                          statusBadgeText.text = "PAUSED BY USER"
                          statusBadgeText.setTextColor(Color.parseColor("#FFD580"))
                          statusSubtitleText.text = "Accessibility Service is connected, but Master Protection is switched off."
                          openSettingsButton.text = "Manage Accessibility Settings"
                      }
                      else -> {
                          statusBadgeText.text = "ACTIVE & PROTECTING INSTAGRAM"
                          statusBadgeText.setTextColor(Color.parseColor("#6DD58C"))
                          statusSubtitleText.text = "Ultra-Low Battery Mode • Explore & Reels Protected • 15-Min Timer Active"
                          openSettingsButton.text = "Open Accessibility Settings"
                      }
                  }
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  if (ReelBlockerAccessibilityService.isServiceCurrentlyRunning) return true
                  val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as? AccessibilityManager ?: return false
                  val enabledServices = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                  val expectedComponent = "$packageName/${ReelBlockerAccessibilityService::class.java.name}"
                  val expectedShortComponent = "$packageName/.${ReelBlockerAccessibilityService::class.java.simpleName}"
                  return enabledServices.any { info ->
                      val id = info.id ?: ""
                      id.equals(expectedComponent, ignoreCase = true) || id.equals(expectedShortComponent, ignoreCase = true)
                  }
              }
          }
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/java/com/instaguard/reelblocker/ReelBlockerAccessibilityService.kt
          package com.instaguard.reelblocker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Rect
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast

          class ReelBlockerAccessibilityService : AccessibilityService() {

              companion object {
                  private const val INSTAGRAM_PACKAGE = "com.instagram.android"

                  const val PREFS_NAME = "instaguard_prefs"
                  const val KEY_MASTER_ENABLED = "master_enabled"
                  const val KEY_REDIRECT_REELS_TAB_TO_DM = "redirect_reels_tab_to_dm"
                  const val KEY_BLOCK_EXPLORE_REELS = "block_explore_reels"
                  const val KEY_ALLOW_SINGLE_DM_REEL = "allow_single_dm_reel"
                  const val KEY_ALLOW_SINGLE_HOME_REEL = "allow_single_home_reel"
                  const val KEY_FIFTEEN_MIN_TIMER = "fifteen_min_timer"

                  // Exact Instagram Resource IDs (searched via native C++ findAccessibilityNodeInfosByViewId)
                  private const val ID_REELS_TAB = "com.instagram.android:id/clips_tab"
                  private const val ID_HOME_TAB = "com.instagram.android:id/feed_tab"
                  private const val ID_EXPLORE_TAB = "com.instagram.android:id/search_tab"

                  private val DM_BUTTON_IDS = arrayOf(
                      "com.instagram.android:id/action_bar_inbox_button",
                      "com.instagram.android:id/direct_tab",
                      "com.instagram.android:id/action_bar_wrapper_inbox_button"
                  )
                  private val DM_SCREEN_IDS = arrayOf(
                      "com.instagram.android:id/row_thread_composer_edittext",
                      "com.instagram.android:id/row_thread_composer_button_send",
                      "com.instagram.android:id/direct_thread_content_below_action_bar",
                      "com.instagram.android:id/message_list",
                      "com.instagram.android:id/thread_list_recyclerview",
                      "com.instagram.android:id/direct_inbox_recycler_view"
                  )
                  private val CLIPS_VIEWER_IDS = arrayOf(
                      "com.instagram.android:id/clips_viewer_view_pager",
                      "com.instagram.android:id/clips_viewer_root",
                      "com.instagram.android:id/clips_item_overlay_component",
                      "com.instagram.android:id/clips_video_container"
                  )
                  private val EXPLORE_POST_FEED_IDS = arrayOf(
                      "com.instagram.android:id/contextual_feed_title",
                      "com.instagram.android:id/chaining_feed_title"
                  )
                  private val STORY_VIEWER_IDS = arrayOf(
                      "com.instagram.android:id/reel_viewer_root",
                      "com.instagram.android:id/reel_viewer_image_view",
                      "com.instagram.android:id/story_viewer_container"
                  )
                  private val COMMENT_OR_SHEET_IDS = arrayOf(
                      "com.instagram.android:id/comment_list",
                      "com.instagram.android:id/layout_comment_thread",
                      "com.instagram.android:id/direct_share_sheet",
                      "com.instagram.android:id/bottom_sheet_container"
                  )
                  private val HOME_FEED_TOP_INDICATORS = arrayOf(
                      "com.instagram.android:id/action_bar_inbox_button",
                      "com.instagram.android:id/tray_recycler_view"
                  )
                  private val REEL_SIGNATURE_IDS = arrayOf(
                      "com.instagram.android:id/clips_author_username",
                      "com.instagram.android:id/clips_author_info",
                      "com.instagram.android:id/clips_caption_component"
                  )

                  private val SAFE_SCROLL_HINTS = listOf(
                      "comment",
                      "message_list",
                      "thread_list",
                      "direct_inbox",
                      "tray_recycler_view",
                      "bottom_sheet",
                      "share_sheet",
                      "carousel"
                  )

                  // Ultra-low battery & debounce timings
                  private const val CONTENT_EVENT_THROTTLE_MS = 220L
                  private const val ACTION_COOLDOWN_MS = 520L
                  private const val INITIAL_REEL_SETTLE_GRACE_MS = 520L
                  private const val ALLOWED_TAP_WINDOW_MS = 3200L
                  private const val DM_REDIRECT_TIMEOUT_MS = 1800L

                  // 15-Minute Usage Limit constants
                  private const val FIFTEEN_MINUTES_MS = 15L * 60L * 1000L
                  private const val SESSION_IDLE_RESET_MS = 2L * 60L * 1000L

                  @Volatile
                  var isServiceCurrentlyRunning: Boolean = false
                      private set
              }

              private enum class ScreenOrigin {
                  HOME_FEED,
                  DM_CHAT_OR_INBOX,
                  EXPLORE_PAGE,
                  OTHER
              }

              private lateinit var prefs: SharedPreferences
              private val mainHandler = Handler(Looper.getMainLooper())

              private var lastOrigin: ScreenOrigin = ScreenOrigin.HOME_FEED
              private var inSingleReelSession: Boolean = false
              private var singleReelOpenedAtMs: Long = 0L
              private var initialReelSignature: String? = null
              private var initialPagerIndex: Int = -1

              private var lastAllowedContentTapAtMs: Long = 0L
              private var lastAllowedTapOrigin: ScreenOrigin = ScreenOrigin.HOME_FEED

              private var pendingClickDmInbox: Boolean = false
              private var pendingClickDmDeadlineMs: Long = 0L

              private var lastContentCheckAtMs: Long = 0L
              private var lastBlockActionAtMs: Long = 0L

              // 15-Minute Usage Session tracking
              private var usageSessionStartAtMs: Long = 0L
              private var lastInstaActivityAtMs: Long = 0L
              private var lastTimerCloseAtMs: Long = 0L

              private val dmClickRetryRunnable = Runnable {
                  val now = SystemClock.elapsedRealtime()
                  if (pendingClickDmInbox && now < pendingClickDmDeadlineMs) {
                      val root = rootInActiveWindow ?: return@Runnable
                      if (tryClickDmButtonFast(root)) {
                          pendingClickDmInbox = false
                          lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                      }
                  } else {
                      pendingClickDmInbox = false
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  isServiceCurrentlyRunning = true
                  prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

                  serviceInfo = serviceInfo.apply {
                      packageNames = arrayOf(INSTAGRAM_PACKAGE)
                      eventTypes = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED or
                              AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED or
                              AccessibilityEvent.TYPE_VIEW_CLICKED or
                              AccessibilityEvent.TYPE_VIEW_SCROLLED or
                              AccessibilityEvent.TYPE_VIEW_SELECTED
                      feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC
                      flags = AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS or
                              AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS
                      notificationTimeout = 140L
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg != INSTAGRAM_PACKAGE) return
                  if (!prefs.getBoolean(KEY_MASTER_ENABLED, true)) return

                  val now = SystemClock.elapsedRealtime()

                  // 1. Check 15-Minute Active Usage Timer
                  if (checkAndEnforceFifteenMinuteLimit(now)) {
                      return
                  }

                  val eventType = event.eventType

                  // 2. Direct Click & Selection Handling (Reels Tab, Explore Grid Tiles, or Home/DM Reel Tap)
                  if (eventType == AccessibilityEvent.TYPE_VIEW_CLICKED ||
                      eventType == AccessibilityEvent.TYPE_VIEW_SELECTED
                  ) {
                      if (isEventSourceReelsBottomTab(event)) {
                          redirectToDmSection(now)
                          return
                      }
                      if (eventType == AccessibilityEvent.TYPE_VIEW_CLICKED) {
                          if (handleClickEventByOrigin(event, now)) {
                              return
                          }
                      }
                  }

                  // 3. Direct Scroll Handling (Enforces stopping on the 2nd Reel for BOTH Home Page and DMs!)
                  if (eventType == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      if (inSingleReelSession) {
                          handleScrollDuringSingleReelSession(event, now)
                          return
                      } else {
                          // Even if inSingleReelSession wasn't set yet, check if scrolled inside ClipsViewer
                          val srcId = event.source?.viewIdResourceName ?: ""
                          if (srcId.contains("clips_viewer")) {
                              handleScrollDuringSingleReelSession(event, now)
                              return
                          }
                      }
                  }

                  // 4. Ultra-low battery throttling for high-frequency content events
                  if (eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) {
                      // If we are calmly watching the 1st allowed Reel and not scrolling, skip heavy checks to save battery
                      if (inSingleReelSession && !pendingClickDmInbox && (now - lastContentCheckAtMs < 400L)) {
                          return
                      }
                      if (now - lastContentCheckAtMs < CONTENT_EVENT_THROTTLE_MS) return
                      lastContentCheckAtMs = now
                  }

                  val root = rootInActiveWindow ?: return
                  evaluateScreenStateFast(root, now)
              }

              /**
               * Tracks active usage inside Instagram. If user uses Instagram for 15 minutes,
               * closes Instagram to the phone's Home Screen and resets the timer for next reopen.
               */
              private fun checkAndEnforceFifteenMinuteLimit(now: Long): Boolean {
                  if (!prefs.getBoolean(KEY_FIFTEEN_MIN_TIMER, true)) {
                      usageSessionStartAtMs = 0L
                      return false
                  }

                  // Ignore residual events within 3 seconds of closing Instagram
                  if (now - lastTimerCloseAtMs < 3000L) return true

                  // Reset session if user was away from Instagram for > 2 minutes
                  if (usageSessionStartAtMs == 0L || (now - lastInstaActivityAtMs) > SESSION_IDLE_RESET_MS) {
                      usageSessionStartAtMs = now
                      lastInstaActivityAtMs = now
                      return false
                  }

                  lastInstaActivityAtMs = now
                  val elapsedActiveMs = now - usageSessionStartAtMs

                  if (elapsedActiveMs >= FIFTEEN_MINUTES_MS) {
                      usageSessionStartAtMs = 0L
                      lastInstaActivityAtMs = 0L
                      lastTimerCloseAtMs = now
                      resetSingleReelSession()
                      Toast.makeText(
                          applicationContext,
                          "15 minutes on Instagram completed! Closing app.",
                          Toast.LENGTH_LONG
                      ).show()
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      return true
                  }
                  return false
              }

              /**
               * Handles clicks based on whether the user is on the Explore Page, Home Feed, or DM Chat.
               */
              private fun handleClickEventByOrigin(event: AccessibilityEvent, now: Long): Boolean {
                  val src = event.source ?: return false
                  val rect = Rect()
                  src.getBoundsInScreen(rect)
                  val screenHeight = resources.displayMetrics.heightPixels
                  val viewId = src.viewIdResourceName ?: ""
                  val className = event.className?.toString() ?: ""

                  // Check if clicked on bottom navigation tabs first
                  if (viewId == ID_EXPLORE_TAB) {
                      lastOrigin = ScreenOrigin.EXPLORE_PAGE
                      resetSingleReelSession()
                      return false
                  }
                  if (viewId == ID_HOME_TAB) {
                      lastOrigin = ScreenOrigin.HOME_FEED
                      resetSingleReelSession()
                      return false
                  }

                  val isMainContentArea = rect.top > (screenHeight * 0.14).toInt() &&
                          rect.bottom < (screenHeight * 0.86).toInt()

                  // EXPLORE PAGE RULE: If user is on Explore page and clicks any post or Reel tile in the grid,
                  // immediately redirect them to the DM page! (Typing in top Search EditText is still allowed).
                  if (lastOrigin == ScreenOrigin.EXPLORE_PAGE &&
                      prefs.getBoolean(KEY_BLOCK_EXPLORE_REELS, true)
                  ) {
                      val isSearchBoxTap = viewId.contains("search", ignoreCase = true) ||
                              className.contains("EditText", ignoreCase = true) ||
                              rect.bottom <= (screenHeight * 0.16).toInt()

                      if (!isSearchBoxTap && isMainContentArea) {
                          redirectToDmSection(now)
                          return true
                      }
                  }

                  // HOME FEED OR DM CHAT: Record allowed tap so the 1st opened Reel plays normally
                  if ((lastOrigin == ScreenOrigin.DM_CHAT_OR_INBOX || lastOrigin == ScreenOrigin.HOME_FEED) &&
                      rect.bottom < (screenHeight * 0.88).toInt()
                  ) {
                      lastAllowedContentTapAtMs = now
                      lastAllowedTapOrigin = lastOrigin
                      lastBlockActionAtMs = 0L
                  }
                  return false
              }

              /**
               * Ultra-fast, low-battery screen state evaluator using Android's native C++
               * findAccessibilityNodeInfosByViewId instead of expensive full-tree walks.
               */
              private fun evaluateScreenStateFast(root: AccessibilityNodeInfo, now: Long) {
                  // 1. Complete pending DM inbox click if we just switched to the Home tab
                  if (pendingClickDmInbox) {
                      if (now < pendingClickDmDeadlineMs) {
                          if (tryClickDmButtonFast(root)) {
                              pendingClickDmInbox = false
                              resetSingleReelSession()
                              lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                              return
                          }
                      } else {
                          pendingClickDmInbox = false
                      }
                  }

                  // 2. Never interfere with Instagram Stories
                  if (hasAnyVisibleNode(root, STORY_VIEWER_IDS)) {
                      return
                  }

                  val screenHeight = resources.displayMetrics.heightPixels
                  val isClipsFullscreen = isFullscreenClipsViewerVisible(root, screenHeight)
                  val isReelsTabSelected = isBottomTabSelected(root, ID_REELS_TAB)
                  val isExploreTabSelected = isBottomTabSelected(root, ID_EXPLORE_TAB)
                  val isHomeTabSelected = isBottomTabSelected(root, ID_HOME_TAB)
                  val isDmScreenVisible = hasAnyVisibleNode(root, DM_SCREEN_IDS)

                  // 3. If user is inside DM Inbox or DM Chat (and full-screen Reel player is not covering it)
                  if (isDmScreenVisible && !isClipsFullscreen) {
                      lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                      resetSingleReelSession()
                      return
                  }

                  // 4. Explore Page checks
                  if (isExploreTabSelected && !isClipsFullscreen) {
                      // If user tapped an Explore post and opened the Explore contextual post feed -> redirect to DMs!
                      if (prefs.getBoolean(KEY_BLOCK_EXPLORE_REELS, true) &&
                          hasAnyVisibleNode(root, EXPLORE_POST_FEED_IDS)
                      ) {
                          redirectToDmSection(now, root)
                          return
                      }
                      lastOrigin = ScreenOrigin.EXPLORE_PAGE
                      resetSingleReelSession()
                      return
                  }

                  // 5. Full-Screen Reel Viewer (ClipsViewer) is active on screen
                  if (isClipsFullscreen) {
                      // If opened from Explore Page -> immediately redirect to DMs!
                      if ((lastOrigin == ScreenOrigin.EXPLORE_PAGE || isExploreTabSelected) &&
                          prefs.getBoolean(KEY_BLOCK_EXPLORE_REELS, true)
                      ) {
                          redirectToDmSection(now, root)
                          return
                      }

                      val allowDmReel = prefs.getBoolean(KEY_ALLOW_SINGLE_DM_REEL, true)
                      val allowHomeReel = prefs.getBoolean(KEY_ALLOW_SINGLE_HOME_REEL, true)

                      val recentlyTappedAllowed = (now - lastAllowedContentTapAtMs) <= ALLOWED_TAP_WINDOW_MS
                      val effectiveOrigin = if (recentlyTappedAllowed) lastAllowedTapOrigin else lastOrigin

                      val isAllowedSingleReel =
                          (effectiveOrigin == ScreenOrigin.DM_CHAT_OR_INBOX && allowDmReel) ||
                          (effectiveOrigin == ScreenOrigin.HOME_FEED && allowHomeReel)

                      // If user clicked the Reels tab directly (not a Reel from Home or DMs), redirect to DMs
                      if (isReelsTabSelected && !inSingleReelSession && !recentlyTappedAllowed) {
                          redirectToDmSection(now, root)
                          return
                      }

                      if (!isAllowedSingleReel) {
                          if (effectiveOrigin == ScreenOrigin.EXPLORE_PAGE) {
                              redirectToDmSection(now, root)
                          } else {
                              triggerBackAction(now)
                          }
                          return
                      }

                      // Start or maintain the Single-Reel Session (works identically for Home Page & DMs!)
                      if (!inSingleReelSession) {
                          inSingleReelSession = true
                          singleReelOpenedAtMs = now
                          initialReelSignature = extractReelSignatureFast(root)
                          initialPagerIndex = -1
                      } else if (now - singleReelOpenedAtMs > INITIAL_REEL_SETTLE_GRACE_MS) {
                          val oldSig = initialReelSignature
                          val newSig = extractReelSignatureFast(root)
                          if (oldSig == null && newSig != null) {
                              initialReelSignature = newSig
                          } else if (oldSig != null && newSig != null && oldSig != newSig &&
                              !hasAnyVisibleNode(root, COMMENT_OR_SHEET_IDS)
                          ) {
                              // Reel author/caption changed -> user scrolled to 2nd Reel -> kick back!
                              resetSingleReelSession()
                              triggerBackAction(now)
                              return
                          }
                      }
                      return
                  }

                  // 6. Bottom Reels Tab selected directly -> block & redirect to DMs
                  if (isReelsTabSelected && !inSingleReelSession) {
                      redirectToDmSection(now, root)
                      return
                  }

                  // 7. User is on the normal Home Feed (only reset session when ClipsViewer is truly closed)
                  if (isHomeTabSelected && !isClipsFullscreen) {
                      lastOrigin = ScreenOrigin.HOME_FEED
                      resetSingleReelSession()
                      return
                  }

                  if (!isClipsFullscreen) {
                      lastOrigin = ScreenOrigin.OTHER
                      resetSingleReelSession()
                  }
              }

              /**
               * Catches any vertical scroll to a 2nd Reel inside the full-screen Reel player
               * (whether opened from a DM chat OR from the Home Page) and immediately presses Back.
               */
              private fun handleScrollDuringSingleReelSession(event: AccessibilityEvent, now: Long) {
                  if (!inSingleReelSession) {
                      // If ClipsViewer just opened from Home or DM without prior state event, initialize session
                      if (lastOrigin == ScreenOrigin.HOME_FEED || lastOrigin == ScreenOrigin.DM_CHAT_OR_INBOX) {
                          inSingleReelSession = true
                          singleReelOpenedAtMs = now
                          initialPagerIndex = event.fromIndex
                      }
                      return
                  }

                  val elapsedSinceOpen = now - singleReelOpenedAtMs
                  val src = event.source
                  val viewId = src?.viewIdResourceName?.lowercase() ?: ""
                  val parentId = src?.parent?.viewIdResourceName?.lowercase() ?: ""
                  val className = event.className?.toString()?.lowercase() ?: ""

                  // Never block scrolling inside Comments, Share Sheets, or Horizontal Carousels
                  if (SAFE_SCROLL_HINTS.any { viewId.contains(it) || parentId.contains(it) }) {
                      return
                  }

                  val isPagerOrListScroll = viewId.contains("clips_viewer") ||
                          parentId.contains("clips_viewer") ||
                          viewId.contains("view_pager") ||
                          className.contains("viewpager") ||
                          className.contains("recyclerview")

                  if (!isPagerOrListScroll) return

                  val currentIndex = event.fromIndex

                  // Ignore initial layout settle scroll events during the first 520ms of opening the Reel
                  if (elapsedSinceOpen <= INITIAL_REEL_SETTLE_GRACE_MS) {
                      if (initialPagerIndex == -1 && currentIndex >= 0) {
                          initialPagerIndex = currentIndex
                      }
                      return
                  }

                  // Verify that comments or share sheet is not open on screen
                  val root = rootInActiveWindow
                  if (root != null) {
                      if (hasAnyVisibleNode(root, COMMENT_OR_SHEET_IDS)) return
                      // Also verify we are still inside the full-screen ClipsViewer (not back on the Home feed list)
                      if (!isFullscreenClipsViewerVisible(root, resources.displayMetrics.heightPixels)) {
                          resetSingleReelSession()
                          return
                      }
                  }

                  val indexChanged = (initialPagerIndex >= 0 && currentIndex >= 0 && currentIndex != initialPagerIndex) ||
                          (currentIndex >= 1)

                  val deltaYScrolled = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      event.scrollDeltaY > 35 || event.scrollDeltaY < -35
                  } else {
                      event.scrollY > 0
                  }

                  val isDirectClipsPager = viewId.contains("clips_viewer") || parentId.contains("clips_viewer")

                  // Any scroll on the ClipsViewer pager after the 520ms settle window means the user swiped to a 2nd Reel!
                  if (indexChanged || deltaYScrolled || isDirectClipsPager) {
                      resetSingleReelSession()
                      triggerBackAction(now)
                  }
              }

              /**
               * Redirects the user to the DM Inbox (used when clicking the Reels tab OR clicking a post/Reel on Explore).
               */
              private fun redirectToDmSection(now: Long, rootNode: AccessibilityNodeInfo? = null) {
                  if (now - lastBlockActionAtMs < ACTION_COOLDOWN_MS) return
                  lastBlockActionAtMs = now
                  resetSingleReelSession()
                  lastAllowedContentTapAtMs = 0L

                  val shouldRedirectToDm = prefs.getBoolean(KEY_REDIRECT_REELS_TAB_TO_DM, true) ||
                          (lastOrigin == ScreenOrigin.EXPLORE_PAGE && prefs.getBoolean(KEY_BLOCK_EXPLORE_REELS, true))

                  val root = rootNode ?: rootInActiveWindow

                  if (shouldRedirectToDm && root != null) {
                      // Step 1: If top-right DM button is already visible, click it directly
                      if (tryClickDmButtonFast(root)) {
                          pendingClickDmInbox = false
                          lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                          return
                      }

                      // Step 2: Click the Home tab first (where the top-right DM button lives) and auto-click DM
                      val homeNodes = root.findAccessibilityNodeInfosByViewId(ID_HOME_TAB)
                      val homeNode = homeNodes?.firstOrNull()
                      if (homeNode != null && clickNodeOrParent(homeNode)) {
                          pendingClickDmInbox = true
                          pendingClickDmDeadlineMs = now + DM_REDIRECT_TIMEOUT_MS
                          mainHandler.removeCallbacks(dmClickRetryRunnable)
                          mainHandler.postDelayed(dmClickRetryRunnable, 150L)
                          mainHandler.postDelayed(dmClickRetryRunnable, 320L)
                          mainHandler.postDelayed(dmClickRetryRunnable, 520L)
                          return
                      }
                  }

                  performGlobalAction(GLOBAL_ACTION_BACK)
              }

              private fun triggerBackAction(now: Long) {
                  if (now - lastBlockActionAtMs < ACTION_COOLDOWN_MS) return
                  lastBlockActionAtMs = now
                  lastAllowedContentTapAtMs = 0L
                  performGlobalAction(GLOBAL_ACTION_BACK)
              }

              private fun resetSingleReelSession() {
                  inSingleReelSession = false
                  singleReelOpenedAtMs = 0L
                  initialReelSignature = null
                  initialPagerIndex = -1
              }

              private fun isEventSourceReelsBottomTab(event: AccessibilityEvent): Boolean {
                  val src = event.source ?: return false
                  val id = src.viewIdResourceName ?: ""
                  if (id == ID_REELS_TAB) return true

                  val desc = src.contentDescription?.toString()?.trim() ?: ""
                  if (desc.equals("Reels", ignoreCase = true)) {
                      val bounds = Rect()
                      src.getBoundsInScreen(bounds)
                      val displayHeight = resources.displayMetrics.heightPixels
                      if (bounds.top >= (displayHeight * 0.80).toInt()) {
                          return true
                      }
                  }
                  return false
              }

              private fun isBottomTabSelected(root: AccessibilityNodeInfo, tabViewId: String): Boolean {
                  val nodes = root.findAccessibilityNodeInfosByViewId(tabViewId) ?: return false
                  return nodes.any { it.isSelected && it.isVisibleToUser }
              }

              private fun hasAnyVisibleNode(root: AccessibilityNodeInfo, viewIds: Array<String>): Boolean {
                  for (id in viewIds) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id)
                      if (nodes != null && nodes.any { it.isVisibleToUser }) {
                          return true
                      }
                  }
                  return false
              }

              /**
               * Accurately distinguishes the full-screen Reel player (ClipsViewer) from an inline Reel
               * on the Home feed by checking both ClipsViewer pager IDs and verifying that the Home feed
               * top action bar / Stories tray is hidden.
               */
              private fun isFullscreenClipsViewerVisible(root: AccessibilityNodeInfo, screenHeight: Int): Boolean {
                  val rect = Rect()
                  val minFullscreenHeight = (screenHeight * 0.70).toInt()

                  // Check primary ClipsViewer pager & overlay IDs
                  for (id in CLIPS_VIEWER_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (!node.isVisibleToUser) continue
                          node.getBoundsInScreen(rect)
                          if (id == "com.instagram.android:id/clips_video_container") {
                              // For clips_video_container, ensure the Home feed top bar is NOT visible
                              if (rect.height() >= minFullscreenHeight &&
                                  !hasAnyVisibleNode(root, HOME_FEED_TOP_INDICATORS)
                              ) {
                                  return true
                              }
                          } else if (rect.height() >= minFullscreenHeight ||
                              id == "com.instagram.android:id/clips_item_overlay_component"
                          ) {
                              return true
                          }
                      }
                  }
                  return false
              }

              private fun extractReelSignatureFast(root: AccessibilityNodeInfo): String? {
                  for (id in REEL_SIGNATURE_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (!node.isVisibleToUser) continue
                          val txt = node.text?.toString()?.trim() ?: ""
                          if (txt.isNotEmpty()) return txt
                          val desc = node.contentDescription?.toString()?.trim() ?: ""
                          if (desc.isNotEmpty()) return desc
                      }
                  }
                  return null
              }

              private fun tryClickDmButtonFast(root: AccessibilityNodeInfo): Boolean {
                  for (id in DM_BUTTON_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (node.isVisibleToUser && clickNodeOrParent(node)) {
                              return true
                          }
                      }
                  }
                  return false
              }

              private fun clickNodeOrParent(node: AccessibilityNodeInfo): Boolean {
                  var current: AccessibilityNodeInfo? = node
                  var depth = 0
                  while (current != null && depth < 4) {
                      if (current.isClickable) {
                          return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      }
                      current = current.parent
                      depth++
                  }
                  return false
              }

              override fun onInterrupt() {
                  resetSingleReelSession()
                  pendingClickDmInbox = false
                  mainHandler.removeCallbacks(dmClickRetryRunnable)
              }

              override fun onDestroy() {
                  isServiceCurrentlyRunning = false
                  resetSingleReelSession()
                  pendingClickDmInbox = false
                  mainHandler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
          EOF

          cd /tmp/InstaReelGuard
          gradle assembleRelease --no-daemon

      - name: Upload Ready-to-Install v2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaReelGuard-v2-APK
          path: /tmp/InstaReelGuard/app/build/outputs/apk/release/app-release.apk
