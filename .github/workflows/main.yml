name: Build InstaReelGuard v3 APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Signed v3.0 Locked DM Edition APK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          # Download Gradle 8.6 directly
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.6/bin:$PATH"

          # Create self-contained Android project directory
          rm -rf /tmp/InstaReelGuard
          mkdir -p /tmp/InstaReelGuard/app/src/main/java/com/instaguard/reelblocker
          mkdir -p /tmp/InstaReelGuard/app/src/main/res/drawable
          mkdir -p /tmp/InstaReelGuard/app/src/main/res/layout
          mkdir -p /tmp/InstaReelGuard/app/src/main/res/values
          mkdir -p /tmp/InstaReelGuard/app/src/main/res/xml

          # Decode fixed RSA-2048 keystore so v3.0 installs directly over v2.0 without uninstalling!
          echo "" | base64 -d > /tmp/InstaReelGuard/app/release-key.jks

          cat << 'EOF' > /tmp/InstaReelGuard/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "InstaReelGuard"
          include(":app")
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.instaguard.reelblocker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.instaguard.reelblocker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "3.0.0"
              }

              signingConfigs {
                  create("releaseSigning") {
                      storeFile = file("release-key.jks")
                      storePassword = "instaguard123"
                      keyAlias = "instaguard_key"
                      keyPassword = "instaguard123"
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("releaseSigning")
                  }
                  debug {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("releaseSigning")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
