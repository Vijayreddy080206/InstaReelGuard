                  // DM Inbox & Chat Thread IDs
                  private val DM_SCREEN_IDS = arrayOf(
                      "com.instagram.android:id/row_thread_composer_edittext",
                      "com.instagram.android:id/row_thread_composer_button_send",
                      "com.instagram.android:id/direct_thread_content_below_action_bar",
                      "com.instagram.android:id/message_list",
                      "com.instagram.android:id/thread_list_recyclerview",
                      "com.instagram.android:id/direct_inbox_recycler_view",
                      "com.instagram.android:id/direct_thread_header"
