                      <TextView
                          android:id="@+id/tv_service_status_subtitle"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="100% Local On-Device Engine â€¢ Zero Internet Permission"
                          android:textColor="#CBD5E1"
                          android:textSize="13sp" />

                      <Button
                          android:id="@+id/btn_open_accessibility_settings"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="16dp"
                          android:background="#2563EB"
                          android:padding="12dp"
                          android:text="Enable in Accessibility Settings"
                          android:textAllCaps="false"
                          android:textColor="#FFFFFF"
                          android:textSize="15sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:background="#151C24"
                      android:orientation="vertical"
                      android:padding="20dp">

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Locked-In Protection Rules (Always Active)"
                          android:textColor="#FFFFFF"
                          android:textSize="16sp"
