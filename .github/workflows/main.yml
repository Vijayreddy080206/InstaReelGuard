          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/java/com/instaguard/reelblocker/MainActivity.kt
          package com.instaguard.reelblocker

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.accessibility.AccessibilityManager
          import android.widget.Button
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var statusBadgeText: TextView
              private lateinit var statusSubtitleText: TextView
              private lateinit var openSettingsButton: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  statusBadgeText = findViewById(R.id.tv_service_status_badge)
                  statusSubtitleText = findViewById(R.id.tv_service_status_subtitle)
                  openSettingsButton = findViewById(R.id.btn_open_accessibility_settings)

                  openSettingsButton.setOnClickListener {
                      val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK
                      }
                      startActivity(intent)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refreshServiceStatusUi()
              }

              private fun refreshServiceStatusUi() {
                  val serviceEnabled = isAccessibilityServiceEnabled()

                  if (!serviceEnabled) {
                      statusBadgeText.text = "ACTION REQUIRED: SERVICE OFF"
                      statusBadgeText.setTextColor(Color.parseColor("#FFB4AB"))
                      statusSubtitleText.text = "Tap the button below -> Downloaded Services -> InstaReelGuard Blocker -> Turn ON."
                      openSettingsButton.text = "Enable in Accessibility Settings"
                  } else {
                      statusBadgeText.text = "LOCKED ON • PURE MESSAGING MODE ACTIVE"
                      statusBadgeText.setTextColor(Color.parseColor("#6DD58C"))
                      statusSubtitleText.text = "DM-Only Launch • Explore Blackout Shield • 15-Min Cap • Ultra-Low Battery"
                      openSettingsButton.text = "Accessibility Settings"
                  }
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  if (ReelBlockerAccessibilityService.isServiceCurrentlyRunning) return true
                  val am = getSystemService(Context.ACCESSIBILITY_SERVICE) as? AccessibilityManager ?: return false
                  val enabledServices = am.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                  val expectedComponent = "$packageName/${ReelBlockerAccessibilityService::class.java.name}"
                  val expectedShortComponent = "$packageName/.${ReelBlockerAccessibilityService::class.java.simpleName}"
                  return enabledServices.any { info ->
                      val id = info.id ?: ""
                      id.equals(expectedComponent, ignoreCase = true) || id.equals(expectedShortComponent, ignoreCase = true)
                  }
              }
          }
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/java/com/instaguard/reelblocker/ReelBlockerAccessibilityService.kt
          package com.instaguard.reelblocker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.Toast

          /**
           * InstaReelGuard v3.0 — Locked Pure Messaging Edition.
           *
           * 1. Always-On Protection: No user switches to disable blocking.
           * 2. Instant DM-Only Launch: Opening Instagram (or landing on the Home page or Reels tab)
           *    immediately clicks the top-right DM button (or switches to Home -> clicks DM),
           *    so the user never sees or scrolls the Home feed or Reels tab.
           * 3. Pixel-Adaptive Explore Blackout Screen: When the user taps the Explore/Search tab,
           *    dynamically measures the exact pixel bottom of the Search bar and exact pixel top
           *    of the Bottom Navigation bar on any phone (iQOO Z10, Samsung, OnePlus, Xiaomi, Pixel)
           *    and covers ONLY the middle Explore content area with a pure AMOLED black (#000000)
           *    shield. Automatically hides when the user taps the Search bar to type a username.
           * 4. DM Single-Reel Allowance: Allows watching individual Reels shared by friends inside DMs,
           *    and kicks back to the DM chat the moment the user scrolls to a 2nd Reel.
           * 5. 15-Minute Session Limit: Closes Instagram after 15 minutes of active usage.
           */
          class ReelBlockerAccessibilityService : AccessibilityService() {

              companion object {
                  private const val INSTAGRAM_PACKAGE = "com.instagram.android"

                  // Bottom Navigation Bar IDs
                  private const val ID_REELS_TAB = "com.instagram.android:id/clips_tab"
                  private const val ID_HOME_TAB = "com.instagram.android:id/feed_tab"
                  private const val ID_EXPLORE_TAB = "com.instagram.android:id/search_tab"
                  private const val ID_TAB_BAR = "com.instagram.android:id/tab_bar"

                  // Top-Right DM Button IDs on Home Screen
                  private val DM_BUTTON_IDS = arrayOf(
                      "com.instagram.android:id/action_bar_inbox_button",
                      "com.instagram.android:id/direct_tab",
                      "com.instagram.android:id/action_bar_wrapper_inbox_button"
                  )

                  // DM Inbox & Chat Thread IDs
                  private val DM_SCREEN_IDS = arrayOf(
                      "com.instagram.android:id/row_thread_composer_edittext",
                      "com.instagram.android:id/row_thread_composer_button_send",
                      "com.instagram.android:id/direct_thread_content_below_action_bar",
                      "com.instagram.android:id/message_list",
                      "com.instagram.android:id/thread_list_recyclerview",
                      "com.instagram.android:id/direct_inbox_recycler_view"
                  )

                  // Explore Top Search Bar IDs (for dynamic pixel-exact top boundary calculation)
                  private val EXPLORE_SEARCH_BAR_IDS = arrayOf(
                      "com.instagram.android:id/action_bar_search_edit_text",
                      "com.instagram.android:id/search_row",
                      "com.instagram.android:id/action_bar_container",
                      "com.instagram.android:id/action_bar_wrapper"
                  )

                  // Active Search Typing / Results Indicators (when user tapped Search bar to find a user)
                  private val SEARCH_ACTIVE_INDICATORS = arrayOf(
                      "com.instagram.android:id/action_bar_button_back",
                      "com.instagram.android:id/ clear_button",
                      "com.instagram.android:id/search_A_recycler_view",
                      "com.instagram.android:id/tabbed_landing_tab_header"
                  )

                  // Full-Screen Reel Viewer (ClipsViewer) IDs
                  private val CLIPS_VIEWER_IDS = arrayOf(
                      "com.instagram.android:id/clips_viewer_view_pager",
                      "com.instagram.android:id/clips_viewer_root",
                      "com.instagram.android:id/clips_item_overlay_component",
                      "com.instagram.android:id/clips_video_container"
                  )

                  private val COMMENT_OR_SHEET_IDS = arrayOf(
                      "com.instagram.android:id/comment_list",
                      "com.instagram.android:id/layout_comment_thread",
                      "com.instagram.android:id/direct_share_sheet",
                      "com.instagram.android:id/bottom_sheet_container"
                  )

                  private val HOME_FEED_TOP_INDICATORS = arrayOf(
                      "com.instagram.android:id/action_bar_inbox_button",
                      "com.instagram.android:id/tray_recycler_view"
                  )

                  private val REEL_SIGNATURE_IDS = arrayOf(
                      "com.instagram.android:id/clips_author_username",
                      "com.instagram.android:id/clips_author_info",
                      "com.instagram.android:id/clips_caption_component"
                  )

                  private val SAFE_SCROLL_HINTS = listOf(
                      "comment",
                      "message_list",
                      "thread_list",
                      "direct_inbox",
                      "tray_recycler_view",
                      "bottom_sheet",
                      "share_sheet",
                      "carousel"
                  )

                  // Ultra-low battery & debounce timings
                  private const val CONTENT_EVENT_THROTTLE_MS = 220L
                  private const val ACTION_COOLDOWN_MS = 450L
                  private const val INITIAL_REEL_SETTLE_GRACE_MS = 520L
                  private const val ALLOWED_TAP_WINDOW_MS = 3500L
                  private const val DM_REDIRECT_TIMEOUT_MS = 1800L

                  // 15-Minute Usage Limit constants
                  private const val FIFTEEN_MINUTES_MS = 15L * 60L * 1000L
                  private const val SESSION_IDLE_RESET_MS = 2L * 60L * 1000L

                  @Volatile
                  var isServiceCurrentlyRunning: Boolean = false
                      private set
              }

              private enum class ScreenOrigin {
                  DM_CHAT_OR_INBOX,
                  EXPLORE_PAGE,
                  HOME_FEED,
                  OTHER
              }

              private val mainHandler = Handler(Looper.getMainLooper())
              private var windowManager: WindowManager? = null

              // Explore Blackout Overlay Views & LayoutParams
              private var exploreBlackoutView: FrameLayout? = null
              private var exploreOverlayParams: WindowManager.LayoutParams? = null
              private var isExploreOverlayAdded: Boolean = false
              private var lastOverlayTopY: Int = -1
              private var lastOverlayHeight: Int = -1

              // State machine variables
              private var lastOrigin: ScreenOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
              private var inSingleReelSession: Boolean = false
              private var singleReelOpenedAtMs: Long = 0L
              private var initialReelSignature: String? = null
              private var initialPagerIndex: Int = -1

              private var lastAllowedDmReelTapAtMs: Long = 0L
              private var searchTypingActiveUntilMs: Long = 0L

              private var pendingClickDmInbox: Boolean = false
              private var pendingClickDmDeadlineMs: Long = 0L

              private var lastContentCheckAtMs: Long = 0L
              private var lastBlockActionAtMs: Long = 0L

              // 15-Minute Usage Session tracking
              private var usageSessionStartAtMs: Long = 0L
              private var lastInstaActivityAtMs: Long = 0L
              private var lastTimerCloseAtMs: Long = 0L

              private val dmClickRetryRunnable = Runnable {
                  val now = SystemClock.elapsedRealtime()
                  if (pendingClickDmInbox && now < pendingClickDmDeadlineMs) {
                      val root = rootInActiveWindow ?: return@Runnable
                      if (tryClickDmButtonFast(root)) {
                          pendingClickDmInbox = false
                          lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                      }
                  } else {
                      pendingClickDmInbox = false
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  isServiceCurrentlyRunning = true
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as? WindowManager

                  serviceInfo = serviceInfo.apply {
                      // Listen for window changes across packages ONLY so we can immediately hide the
                      // Explore Blackout Overlay the instant the user leaves Instagram!
                      packageNames = null
                      eventTypes = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED or
                              AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED or
                              AccessibilityEvent.TYPE_VIEW_CLICKED or
                              AccessibilityEvent.TYPE_VIEW_SCROLLED or
                              AccessibilityEvent.TYPE_VIEW_SELECTED or
                              AccessibilityEvent.TYPE_VIEW_FOCUSED
                      feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC
                      flags = AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS or
                              AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS
                      notificationTimeout = 140L
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  val pkg = event.packageName?.toString() ?: return

                  // Zero-battery fast exit for all non-Instagram apps, while ensuring overlay is hidden
                  if (pkg != INSTAGRAM_PACKAGE) {
                      // Ignore our own overlay events
                      if (pkg == packageName) return
                      if (isExploreOverlayAdded) {
                          hideExploreBlackoutOverlay()
                      }
                      return
                  }

                  val now = SystemClock.elapsedRealtime()

                  // 1. Check 15-Minute Active Usage Timer
                  if (checkAndEnforceFifteenMinuteLimit(now)) {
                      hideExploreBlackoutOverlay()
                      return
                  }

                  val eventType = event.eventType

                  // 2. Handle Click, Selection & Focus Events
                  if (eventType == AccessibilityEvent.TYPE_VIEW_CLICKED ||
                      eventType == AccessibilityEvent.TYPE_VIEW_SELECTED ||
                      eventType == AccessibilityEvent.TYPE_VIEW_FOCUSED
                  ) {
                      if (isEventSourceReelsBottomTab(event)) {
                          hideExploreBlackoutOverlay()
                          redirectToDmSection(now)
                          return
                      }
                      if (handleDirectClickOrFocus(event, now)) {
                          return
                      }
                  }

                  // 3. Handle Scroll Events (Stop scrolling to a 2nd Reel in DM Reel player)
                  if (eventType == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      if (inSingleReelSession) {
                          handleScrollDuringSingleReelSession(event, now)
                          return
                      } else {
                          val srcId = event.source?.viewIdResourceName ?: ""
                          if (srcId.contains("clips_viewer")) {
                              handleScrollDuringSingleReelSession(event, now)
                              return
                          }
                      }
                  }

                  // 4. Ultra-low battery throttling for high-frequency content events
                  if (eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) {
                      if (inSingleReelSession && !pendingClickDmInbox && (now - lastContentCheckAtMs < 400L)) {
                          return
                      }
                      if (now - lastContentCheckAtMs < CONTENT_EVENT_THROTTLE_MS) return
                      lastContentCheckAtMs = now
                  }

                  val root = rootInActiveWindow ?: return
                  if (root.packageName?.toString() != INSTAGRAM_PACKAGE) {
                      hideExploreBlackoutOverlay()
                      return
                  }
                  evaluateScreenStateFast(root, now)
              }

              private fun checkAndEnforceFifteenMinuteLimit(now: Long): Boolean {
                  if (now - lastTimerCloseAtMs < 3000L) return true

                  if (usageSessionStartAtMs == 0L || (now - lastInstaActivityAtMs) > SESSION_IDLE_RESET_MS) {
                      usageSessionStartAtMs = now
                      lastInstaActivityAtMs = now
                      return false
                  }

                  lastInstaActivityAtMs = now
                  if (now - usageSessionStartAtMs >= FIFTEEN_MINUTES_MS) {
                      usageSessionStartAtMs = 0L
                      lastInstaActivityAtMs = 0L
                      lastTimerCloseAtMs = now
                      resetSingleReelSession()
                      hideExploreBlackoutOverlay()
                      Toast.makeText(
                          applicationContext,
                          "15 minutes on Instagram completed! Closing app.",
                          Toast.LENGTH_LONG
                      ).show()
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      return true
                  }
                  return false
              }

              private fun handleDirectClickOrFocus(event: AccessibilityEvent, now: Long): Boolean {
                  val src = event.source ?: return false
                  val viewId = src.viewIdResourceName ?: ""
                  val className = event.className?.toString() ?: ""
                  val rect = Rect()
                  src.getBoundsInScreen(rect)
                  val screenHeight = resources.displayMetrics.heightPixels

                  // If user tapped the Search bar at the top of Explore to type a username -> hide blackout shield
                  if (viewId.contains("action_bar_search_edit_text") ||
                      viewId.contains("search_row") ||
                      className.contains("EditText", ignoreCase = true) ||
                      (lastOrigin == ScreenOrigin.EXPLORE_PAGE && rect.bottom <= (screenHeight * 0.17).toInt())
                  ) {
                      searchTypingActiveUntilMs = now + 2500L
                      hideExploreBlackoutOverlay()
                      return false
                  }

                  // If user tapped the Explore tab button on the bottom bar
                  if (viewId == ID_EXPLORE_TAB) {
                      lastOrigin = ScreenOrigin.EXPLORE_PAGE
                      searchTypingActiveUntilMs = 0L
                      resetSingleReelSession()
                      val root = rootInActiveWindow
                      if (root != null) {
                          showOrUpdateExploreBlackoutOverlay(root)
                      }
                      return false
                  }

                  // If user tapped the Home tab button on the bottom bar -> immediately redirect to DMs!
                  if (viewId == ID_HOME_TAB) {
                      hideExploreBlackoutOverlay()
                      redirectToDmSection(now)
                      return true
                  }

                  // If user is inside a DM chat and taps a shared Reel in the chat area
                  if (lastOrigin == ScreenOrigin.DM_CHAT_OR_INBOX &&
                      event.eventType == AccessibilityEvent.TYPE_VIEW_CLICKED &&
                      rect.bottom < (screenHeight * 0.88).toInt()
                  ) {
                      lastAllowedDmReelTapAtMs = now
                      lastBlockActionAtMs = 0L
                  }
                  return false
              }

              /**
               * Evaluates the active Instagram screen using ultra-fast native C++ ID lookups.
               */
              private fun evaluateScreenStateFast(root: AccessibilityNodeInfo, now: Long) {
                  // 1. Complete pending DM inbox click if we just landed on Home
                  if (pendingClickDmInbox) {
                      if (now < pendingClickDmDeadlineMs) {
                          if (tryClickDmButtonFast(root)) {
                              pendingClickDmInbox = false
                              hideExploreBlackoutOverlay()
                              resetSingleReelSession()
                              lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                              return
                          }
                      } else {
                          pendingClickDmInbox = false
                      }
                  }

                  val screenHeight = resources.displayMetrics.heightPixels
                  val isClipsFullscreen = isFullscreenClipsViewerVisible(root, screenHeight)
                  val isReelsTabSelected = isBottomTabSelected(root, ID_REELS_TAB)
                  val isExploreTabSelected = isBottomTabSelected(root, ID_EXPLORE_TAB)
                  val isHomeTabSelected = isBottomTabSelected(root, ID_HOME_TAB)
                  val isDmScreenVisible = hasAnyVisibleNode(root, DM_SCREEN_IDS)

                  // 2. User is inside DM Inbox or a Friend's DM Chat Thread
                  if (isDmScreenVisible && !isClipsFullscreen) {
                      hideExploreBlackoutOverlay()
                      lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                      resetSingleReelSession()
                      return
                  }

                  // 3. User is on the Explore / Search Tab
                  if (isExploreTabSelected && !isClipsFullscreen) {
                      lastOrigin = ScreenOrigin.EXPLORE_PAGE
                      resetSingleReelSession()

                      // Check if user is actively typing/searching in the top Search bar
                      if (isSearchTypingOrResultsActive(root, now)) {
                          hideExploreBlackoutOverlay()
                      } else {
                          showOrUpdateExploreBlackoutOverlay(root)
                      }
                      return
                  } else {
                      // Not on Explore tab -> make sure Explore Blackout Overlay is hidden
                      hideExploreBlackoutOverlay()
                  }

                  // 4. Full-Screen Reel Viewer (ClipsViewer) is visible
                  if (isClipsFullscreen) {
                      val recentlyTappedInDm = (now - lastAllowedDmReelTapAtMs) <= ALLOWED_TAP_WINDOW_MS
                      val allowedFromDm = (lastOrigin == ScreenOrigin.DM_CHAT_OR_INBOX || recentlyTappedInDm)

                      // Only Reels opened from a Friend's DM Chat are allowed!
                      // Any Reel opened from Reels tab, Home, or Explore is immediately redirected to DMs or closed.
                      if (!allowedFromDm || (isReelsTabSelected && !inSingleReelSession && !recentlyTappedInDm)) {
                          redirectToDmSection(now, root)
                          return
                      }

                      if (!inSingleReelSession) {
                          inSingleReelSession = true
                          singleReelOpenedAtMs = now
                          initialReelSignature = extractReelSignatureFast(root)
                          initialPagerIndex = -1
                      } else if (now - singleReelOpenedAtMs > INITIAL_REEL_SETTLE_GRACE_MS) {
                          val oldSig = initialReelSignature
                          val newSig = extractReelSignatureFast(root)
                          if (oldSig == null && newSig != null) {
                              initialReelSignature = newSig
                          } else if (oldSig != null && newSig != null && oldSig != newSig &&
                              !hasAnyVisibleNode(root, COMMENT_OR_SHEET_IDS)
                          ) {
                              // User scrolled to a 2nd Reel -> kick right back into the friend's DM chat!
                              resetSingleReelSession()
                              triggerBackAction(now)
                              return
                          }
                      }
                      return
                  }

                  // 5. Reels Tab OR Home Feed is visible -> Immediately redirect to DM Inbox!
                  // (The minute the user opens Instagram on the Home feed, it clicks the DM icon and enters DMs!)
                  if (isReelsTabSelected || isHomeTabSelected || hasAnyVisibleNode(root, HOME_FEED_TOP_INDICATORS)) {
                      resetSingleReelSession()
                      redirectToDmSection(now, root)
                      return
                  }
              }

              /**
               * Determines if the user is actively typing a query or viewing username search results
               * after tapping the top Search bar on the Explore tab.
               */
              private fun isSearchTypingOrResultsActive(root: AccessibilityNodeInfo, now: Long): Boolean {
                  if (now < searchTypingActiveUntilMs) return true

                  // Check if the Search EditText is focused or has typed characters
                  val searchNodes = root.findAccessibilityNodeInfosByViewId("com.instagram.android:id/action_bar_search_edit_text")
                  if (searchNodes != null) {
                      for (node in searchNodes) {
                          if (!node.isVisibleToUser) continue
                          if (node.isFocused) return true
                          val txt = node.text?.toString()?.trim() ?: ""
                          // Default hint is "Search" or empty; if user typed something else, keep results visible
                          if (txt.isNotEmpty() && !txt.equals("Search", ignoreCase = true)) {
                              return true
                          }
                      }
                  }

                  // Check if the top-left Back arrow inside the active search sub-screen is visible
                  if (hasAnyVisibleNode(root, SEARCH_ACTIVE_INDICATORS)) {
                      return true
                  }
                  return false
              }

              /**
               * Dynamically measures the exact pixel bottom of the Search bar and exact pixel top
               * of the Bottom Navigation bar on ANY Android phone (iQOO Z10, Samsung, OnePlus, Pixel, etc.)
               * and places a pure black (#000000) shield over ONLY the middle Explore content area.
               */
              private fun showOrUpdateExploreBlackoutOverlay(root: AccessibilityNodeInfo) {
                  val wm = windowManager ?: return
                  val metrics = resources.displayMetrics
                  val screenHeight = metrics.heightPixels
                  val rect = Rect()

                  // 1. Dynamically find the bottom pixel of the top Search bar
                  var topEdgeY = -1
                  for (id in EXPLORE_SEARCH_BAR_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (!node.isVisibleToUser) continue
                          node.getBoundsInScreen(rect)
                          if (rect.bottom > 0 && rect.bottom < (screenHeight * 0.28).toInt()) {
                              if (rect.bottom > topEdgeY) {
                                  topEdgeY = rect.bottom
                              }
                          }
                      }
                      if (topEdgeY > 0) break
                  }

                  // Fallback if Instagram hasn't finished laying out the Search bar node yet
                  if (topEdgeY <= 0) {
                      topEdgeY = getStatusBarHeightPx() + dpToPx(58f)
                  }

                  // 2. Dynamically find the top pixel of the Bottom Navigation Bar
                  var bottomEdgeY = -1
                  val bottomBarIds = arrayOf(ID_TAB_BAR, ID_EXPLORE_TAB, ID_HOME_TAB, ID_REELS_TAB)
                  for (id in bottomBarIds) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (!node.isVisibleToUser) continue
                          node.getBoundsInScreen(rect)
                          if (rect.top > (screenHeight * 0.72).toInt()) {
                              bottomEdgeY = rect.top
                              break
                          }
                      }
                      if (bottomEdgeY > 0) break
                  }

                  // Fallback if bottom bar node bounds aren't reported yet
                  if (bottomEdgeY <= topEdgeY) {
                      bottomEdgeY = screenHeight - getNavigationBarHeightPx() - dpToPx(52f)
                  }

                  val overlayHeight = (bottomEdgeY - topEdgeY).coerceAtLeast(dpToPx(200f))

                  if (exploreBlackoutView == null) {
                      val container = FrameLayout(this).apply {
                          setBackgroundColor(Color.BLACK)
                          // Absorb touches on the middle Explore grid so no hidden Reel/post can be clicked
                          isClickable = true
                          isFocusable = false
                      }
                      val label = TextView(this).apply {
                          text = "Explore Feed Hidden • Use Search Bar Above"
                          setTextColor(Color.parseColor("#3B424C"))
                          textSize = 13f
                          gravity = Gravity.CENTER
                      }
                      val lp = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      )
                      container.addView(label, lp)
                      exploreBlackoutView = container
                  }

                  if (exploreOverlayParams == null) {
                      exploreOverlayParams = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          overlayHeight,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.OPAQUE
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = 0
                          y = topEdgeY
                      }
                  }

                  try {
                      if (!isExploreOverlayAdded) {
                          exploreOverlayParams!!.y = topEdgeY
                          exploreOverlayParams!!.height = overlayHeight
                          wm.addView(exploreBlackoutView, exploreOverlayParams)
                          isExploreOverlayAdded = true
                          lastOverlayTopY = topEdgeY
                          lastOverlayHeight = overlayHeight
                      } else if (kotlin.math.abs(lastOverlayTopY - topEdgeY) > 4 ||
                          kotlin.math.abs(lastOverlayHeight - overlayHeight) > 4
                      ) {
                          exploreOverlayParams!!.y = topEdgeY
                          exploreOverlayParams!!.height = overlayHeight
                          wm.updateViewLayout(exploreBlackoutView, exploreOverlayParams)
                          lastOverlayTopY = topEdgeY
                          lastOverlayHeight = overlayHeight
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun hideExploreBlackoutOverlay() {
                  if (!isExploreOverlayAdded) return
                  val wm = windowManager ?: return
                  val view = exploreBlackoutView ?: return
                  try {
                      wm.removeViewImmediate(view)
                  } catch (_: Throwable) {
                  } finally {
                      isExploreOverlayAdded = false
                  }
              }

              private fun dpToPx(dp: Float): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      dp,
                      resources.displayMetrics
                  ).toInt()
              }

              private fun getStatusBarHeightPx(): Int {
                  val resId = resources.getIdentifier("status_bar_height", "dimen", "android")
                  return if (resId > 0) resources.getDimensionPixelSize(resId) else dpToPx(32f)
              }

              private fun getNavigationBarHeightPx(): Int {
                  val resId = resources.getIdentifier("navigation_bar_height", "dimen", "android")
                  return if (resId > 0) resources.getDimensionPixelSize(resId) else dpToPx(42f)
              }

              /**
               * Catches any vertical scroll to a 2nd Reel inside the full-screen Reel player
               * opened from a DM chat and immediately returns the user to that chat.
               */
              private fun handleScrollDuringSingleReelSession(event: AccessibilityEvent, now: Long) {
                  if (!inSingleReelSession) {
                      if (lastOrigin == ScreenOrigin.DM_CHAT_OR_INBOX) {
                          inSingleReelSession = true
                          singleReelOpenedAtMs = now
                          initialPagerIndex = event.fromIndex
                      }
                      return
                  }

                  val elapsedSinceOpen = now - singleReelOpenedAtMs
                  val src = event.source
                  val viewId = src?.viewIdResourceName?.lowercase() ?: ""
                  val parentId = src?.parent?.viewIdResourceName?.lowercase() ?: ""
                  val className = event.className?.toString()?.lowercase() ?: ""

                  if (SAFE_SCROLL_HINTS.any { viewId.contains(it) || parentId.contains(it) }) {
                      return
                  }

                  val isPagerOrListScroll = viewId.contains("clips_viewer") ||
                          parentId.contains("clips_viewer") ||
                          viewId.contains("view_pager") ||
                          className.contains("viewpager") ||
                          className.contains("recyclerview")

                  if (!isPagerOrListScroll) return

                  val currentIndex = event.fromIndex

                  if (elapsedSinceOpen <= INITIAL_REEL_SETTLE_GRACE_MS) {
                      if (initialPagerIndex == -1 && currentIndex >= 0) {
                          initialPagerIndex = currentIndex
                      }
                      return
                  }

                  val root = rootInActiveWindow
                  if (root != null) {
                      if (hasAnyVisibleNode(root, COMMENT_OR_SHEET_IDS)) return
                      if (!isFullscreenClipsViewerVisible(root, resources.displayMetrics.heightPixels)) {
                          resetSingleReelSession()
                          return
                      }
                  }

                  val indexChanged = (initialPagerIndex >= 0 && currentIndex >= 0 && currentIndex != initialPagerIndex) ||
                          (currentIndex >= 1)

                  val deltaYScrolled = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      event.scrollDeltaY > 35 || event.scrollDeltaY < -35
                  } else {
                      event.scrollY > 0
                  }

                  val isDirectClipsPager = viewId.contains("clips_viewer") || parentId.contains("clips_viewer")

                  if (indexChanged || deltaYScrolled || isDirectClipsPager) {
                      resetSingleReelSession()
                      triggerBackAction(now)
                  }
              }

              /**
               * Redirects the user immediately to the DM Inbox (clicks top-right DM icon if on Home,
               * or clicks Home tab -> clicks DM icon if on Reels tab).
               */
              private fun redirectToDmSection(now: Long, rootNode: AccessibilityNodeInfo? = null) {
                  if (now - lastBlockActionAtMs < ACTION_COOLDOWN_MS) return
                  lastBlockActionAtMs = now
                  resetSingleReelSession()
                  lastAllowedDmReelTapAtMs = 0L
                  hideExploreBlackoutOverlay()

                  val root = rootNode ?: rootInActiveWindow

                  if (root != null) {
                      // Step 1: If top-right DM button is already visible (e.g., on Home screen), click it immediately!
                      if (tryClickDmButtonFast(root)) {
                          pendingClickDmInbox = false
                          lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                          return
                      }

                      // Step 2: Click the Home tab first so the top-right DM button appears, then auto-click DM
                      val homeNodes = root.findAccessibilityNodeInfosByViewId(ID_HOME_TAB)
                      val homeNode = homeNodes?.firstOrNull()
                      if (homeNode != null && clickNodeOrParent(homeNode)) {
                          pendingClickDmInbox = true
                          pendingClickDmDeadlineMs = now + DM_REDIRECT_TIMEOUT_MS
                          mainHandler.removeCallbacks(dmClickRetryRunnable)
                          mainHandler.postDelayed(dmClickRetryRunnable, 120L)
                          mainHandler.postDelayed(dmClickRetryRunnable, 280L)
                          mainHandler.postDelayed(dmClickRetryRunnable, 480L)
                          return
                      }
                  }

                  performGlobalAction(GLOBAL_ACTION_BACK)
              }

              private fun triggerBackAction(now: Long) {
                  if (now - lastBlockActionAtMs < ACTION_COOLDOWN_MS) return
                  lastBlockActionAtMs = now
                  lastAllowedDmReelTapAtMs = 0L
                  performGlobalAction(GLOBAL_ACTION_BACK)
              }

              private fun resetSingleReelSession() {
                  inSingleReelSession = false
                  singleReelOpenedAtMs = 0L
                  initialReelSignature = null
                  initialPagerIndex = -1
              }

              private fun isEventSourceReelsBottomTab(event: AccessibilityEvent): Boolean {
                  val src = event.source ?: return false
                  val id = src.viewIdResourceName ?: ""
                  if (id == ID_REELS_TAB) return true

                  val desc = src.contentDescription?.toString()?.trim() ?: ""
                  if (desc.equals("Reels", ignoreCase = true)) {
                      val bounds = Rect()
                      src.getBoundsInScreen(bounds)
                      val displayHeight = resources.displayMetrics.heightPixels
                      if (bounds.top >= (displayHeight * 0.80).toInt()) {
                          return true
                      }
                  }
                  return false
              }

              private fun isBottomTabSelected(root: AccessibilityNodeInfo, tabViewId: String): Boolean {
                  val nodes = root.findAccessibilityNodeInfosByViewId(tabViewId) ?: return false
                  return nodes.any { it.isSelected && it.isVisibleToUser }
              }

              private fun hasAnyVisibleNode(root: AccessibilityNodeInfo, viewIds: Array<String>): Boolean {
                  for (id in viewIds) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id)
                      if (nodes != null && nodes.any { it.isVisibleToUser }) {
                          return true
                      }
                  }
                  return false
              }

              private fun isFullscreenClipsViewerVisible(root: AccessibilityNodeInfo, screenHeight: Int): Boolean {
                  val rect = Rect()
                  val minFullscreenHeight = (screenHeight * 0.70).toInt()

                  for (id in CLIPS_VIEWER_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (!node.isVisibleToUser) continue
                          node.getBoundsInScreen(rect)
                          if (id == "com.instagram.android:id/clips_video_container") {
                              if (rect.height() >= minFullscreenHeight &&
                                  !hasAnyVisibleNode(root, HOME_FEED_TOP_INDICATORS)
                              ) {
                                  return true
                              }
                          } else if (rect.height() >= minFullscreenHeight ||
                              id == "com.instagram.android:id/clips_item_overlay_component"
                          ) {
                              return true
                          }
                      }
                  }
                  return false
              }

              private fun extractReelSignatureFast(root: AccessibilityNodeInfo): String? {
                  for (id in REEL_SIGNATURE_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (!node.isVisibleToUser) continue
                          val txt = node.text?.toString()?.trim() ?: ""
                          if (txt.isNotEmpty()) return txt
                          val desc = node.contentDescription?.toString()?.trim() ?: ""
                          if (desc.isNotEmpty()) return desc
                      }
                  }
                  return null
              }

              private fun tryClickDmButtonFast(root: AccessibilityNodeInfo): Boolean {
                  for (id in DM_BUTTON_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (node.isVisibleToUser && clickNodeOrParent(node)) {
                              return true
                          }
                      }
                  }
                  return false
              }

              private fun clickNodeOrParent(node: AccessibilityNodeInfo): Boolean {
                  var current: AccessibilityNodeInfo? = node
                  var depth = 0
                  while (current != null && depth < 4) {
                      if (current.isClickable) {
                          return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      }
                      current = current.parent
                      depth++
                  }
                  return false
              }

              override fun onInterrupt() {
                  hideExploreBlackoutOverlay()
                  resetSingleReelSession()
                  pendingClickDmInbox = false
                  mainHandler.removeCallbacks(dmClickRetryRunnable)
              }

              override fun onDestroy() {
                  isServiceCurrentlyRunning = false
                  hideExploreBlackoutOverlay()
                  resetSingleReelSession()
                  pendingClickDmInbox = false
                  mainHandler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
