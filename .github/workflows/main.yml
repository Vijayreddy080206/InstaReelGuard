name: Build InstaReelGuard v7 APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Signed v7.0 APK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          # Download Gradle 8.6 directly
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.6/bin:$PATH"

          # Create self-contained Android project directory
          rm -rf /tmp/InstaReelGuard
          mkdir -p /tmp/InstaReelGuard/app/src/main/java/com/instaguard/reelblocker
          mkdir -p /tmp/InstaReelGuard/app/src/main/res/drawable
          mkdir -p /tmp/InstaReelGuard/app/src/main/res/layout
          mkdir -p /tmp/InstaReelGuard/app/src/main/res/values
          mkdir -p /tmp/InstaReelGuard/app/src/main/res/xml

          # Decode fixed RSA-2048 keystore so v7.0 installs directly over previous versions
          echo "" | base64 -d > /tmp/InstaReelGuard/app/release-key.jks

          cat << 'EOF' > /tmp/InstaReelGuard/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "InstaReelGuard"
          include(":app")
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.instaguard.reelblocker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.instaguard.reelblocker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 8
                  versionName = "7.0.0"
              }

              signingConfigs {
                  create("releaseSigning") {
                      storeFile = file("release-key.jks")
                      storePassword = "instaguard123"
                      keyAlias = "instaguard_key"
                      keyPassword = "instaguard123"
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("releaseSigning")
                  }
                  debug {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("releaseSigning")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#2563EB"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,24L28,36v22c0,18.5 11.1,35.6 26,42 14.9,-6.4 26,-23.5 26,-42V36L54,24zM48,68L36,56l4.2,-4.2L48,59.6l19.8,-19.8L72,44 48,68z" />
          </vector>
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ReelBlockerAccessibilityService"
                      android:exported="false"
                      android:label="@string/accessibility_service_label"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>

          </manifest>
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">InstaReelGuard</string>
              <string name="accessibility_service_label">InstaReelGuard Blocker</string>
              <string name="accessibility_service_description">Transforms Instagram into a pure messaging app: auto-redirects to DMs on launch, locks a black shield over the Explore grid at 0ms (hiding when you tap Search or pull down the Notification shade), allows single shared Reels in DMs, and enforces a 15-minute session limit.</string>
          </resources>
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewClicked|typeViewScrolled|typeViewSelected|typeViewFocused"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="80"
              android:settingsActivity="com.instaguard.reelblocker.MainActivity" />
          EOF

          cat << 'EOF' > /tmp/InstaReelGuard/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
