                  // Explore Top Search Bar IDs
                  private val EXPLORE_SEARCH_BAR_IDS = arrayOf(
                      "com.instagram.android:id/action_bar_search_edit_text",
                      "com.instagram.android:id/search_row",
                      "com.instagram.android:id/action_bar_container",
                      "com.instagram.android:id/action_bar_wrapper"
                  )

                  // Explore Specific Top Search Box (only present on Explore/Search tab!)
                  private val EXPLORE_ONLY_SEARCH_BOX_IDS = arrayOf(
                      "com.instagram.android:id/action_bar_search_edit_text",
                      "com.instagram.android:id/search_row"
                  )

                  // Active Search Typing / Results Indicators
                  private val SEARCH_ACTIVE_INDICATORS = arrayOf(
                      "com.instagram.android:id/action_bar_button_back",
                      "com.instagram.android:id/clear_button",
                      "com.instagram.android:id/search_recycler_view",
                      "com.instagram.android:id/tabbed_landing_tab_header"
                  )

                  // Full-Screen Reel Viewer (ClipsViewer) IDs
                  private val CLIPS_VIEWER_IDS = arrayOf(
                      "com.instagram.android:id/clips_viewer_view_pager",
                      "com.instagram.android:id/clips_viewer_root",
                      "com.instagram.android:id/clips_item_overlay_component",
                      "com.instagram.android:id/clips_video_container"
                  )

                  private val COMMENT_OR_SHEET_IDS = arrayOf(
                      "com.instagram.android:id/comment_list",
                      "com.instagram.android:id/layout_comment_thread",
                      "com.instagram.android:id/direct_share_sheet",
                      "com.instagram.android:id/bottom_sheet_container"
                  )

                  private val HOME_FEED_INDICATORS = arrayOf(
                      "com.instagram.android:id/action_bar_inbox_button",
                      "com.instagram.android:id/tray_recycler_view",
                      "com.instagram.android:id/main_feed_recycler_view"
                  )

                  private val REEL_SIGNATURE_IDS = arrayOf(
                      "com.instagram.android:id/clips_author_username",
                      "com.instagram.android:id/clips_author_info",
                      "com.instagram.android:id/clips_caption_component"
                  )

                  private val SAFE_SCROLL_HINTS = listOf(
                      "comment",
                      "message_list",
                      "thread_list",
                      "direct_inbox",
                      "tray_recycler_view",
                      "bottom_sheet",
                      "share_sheet",
                      "carousel"
                  )

                  // Packages that emit background/status-bar events while Instagram is still open on screen
                  private val IGNORED_SYSTEM_PACKAGES = listOf(
                      "com.android.systemui",
                      "inputmethod",
                      "keyboard",
                      "gboard",
                      "honeyboard",
                      "ims",
                      "permissioncontroller",
                      "volume"
                  )

                  // Timings
                  private const val CONTENT_EVENT_THROTTLE_MS = 160L
                  private const val ACTION_COOLDOWN_MS = 320L
                  private const val INITIAL_REEL_SETTLE_GRACE_MS = 520L
                  private const val ALLOWED_TAP_WINDOW_MS = 3800L
                  private const val DM_REDIRECT_TIMEOUT_MS = 5000L

                  // 15-Minute Usage Limit constants
                  private const val FIFTEEN_MINUTES_MS = 15L * 60L * 1000L
                  private const val SESSION_IDLE_RESET_MS = 2L * 60L * 1000L

                  @Volatile
                  var isServiceCurrentlyRunning: Boolean = false
                      private set
              }

              private enum class ScreenOrigin {
                  DM_CHAT_OR_INBOX,
                  EXPLORE_PAGE,
                  HOME_FEED,
                  OTHER
              }

              private val mainHandler = Handler(Looper.getMainLooper())
              private var windowManager: WindowManager? = null

              // Explore Blackout Overlay Views & LayoutParams
              private var exploreBlackoutView: FrameLayout? = null
              private var exploreOverlayParams: WindowManager.LayoutParams? = null
              private var isExploreOverlayAdded: Boolean = false
              private var exploreModeLockedOn: Boolean = false
              private var lastOverlayTopY: Int = -1
              private var lastOverlayHeight: Int = -1

              // State machine variables
              private var lastOrigin: ScreenOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
              private var inSingleReelSession: Boolean = false
              private var singleReelOpenedAtMs: Long = 0L
              private var initialReelSignature: String? = null
              private var initialPagerIndex: Int = -1

              private var lastAllowedDmReelTapAtMs: Long = 0L
              private var searchTypingActiveUntilMs: Long = 0L

              private var pendingClickDmInbox: Boolean = false
              private var pendingClickDmDeadlineMs: Long = 0L

              private var lastContentCheckAtMs: Long = 0L
              private var lastBlockActionAtMs: Long = 0L
              private var wasInstagramInForeground: Boolean = false

              // 15-Minute Usage Session tracking
              private var usageSessionStartAtMs: Long = 0L
              private var lastInstaActivityAtMs: Long = 0L
              private var lastTimerCloseAtMs: Long = 0L

              /**
               * Persistent 5-second retry loop that runs every 150ms when Instagram opens or lands on
               * the Home/Reels screen, guaranteeing it clicks the DM icon the exact millisecond Instagram
               * finishes loading the Home screen!
               */
              private val dmClickRetryRunnable = object : Runnable {
                  override fun run() {
                      val now = SystemClock.elapsedRealtime()
                      if (!pendingClickDmInbox || now >= pendingClickDmDeadlineMs) {
                          pendingClickDmInbox = false
                          return
                      }
                      if (exploreModeLockedOn) {
                          pendingClickDmInbox = false
                          return
                      }
                      val root = getInstagramRootWindow()
                      if (root != null) {
                          if (hasAnyVisibleNode(root, DM_SCREEN_IDS)) {
                              pendingClickDmInbox = false
                              lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                              return
                          }
                          if (tryClickDmButtonComprehensive(root)) {
                              pendingClickDmInbox = false
                              lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                              return
                          }
                          if (isBottomTabSelected(root, ID_REELS_TAB)) {
                              val homeNode = root.findAccessibilityNodeInfosByViewId(ID_HOME_TAB)?.firstOrNull()
                              if (homeNode != null) {
                                  clickNodeOrParent(homeNode)
                              }
                          }
                      }
                      mainHandler.postDelayed(this, 150L)
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  isServiceCurrentlyRunning = true
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as? WindowManager

                  serviceInfo = serviceInfo.apply {
                      packageNames = null
                      eventTypes = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED or
                              AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED or
                              AccessibilityEvent.TYPE_VIEW_CLICKED or
                              AccessibilityEvent.TYPE_VIEW_SCROLLED or
                              AccessibilityEvent.TYPE_VIEW_SELECTED or
                              AccessibilityEvent.TYPE_VIEW_FOCUSED
                      feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC
                      flags = AccessibilityServiceInfo.FLAG_REPORT_VIEW_IDS or
                              AccessibilityServiceInfo.FLAG_INCLUDE_NOT_IMPORTANT_VIEWS or
                              AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS
                      notificationTimeout = 100L
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  val pkg = event.packageName?.toString() ?: return

                  // 1. Ignore our own overlay and status-bar/keyboard packages (fixes the 1-second flicker on iQOO Z10!)
                  if (pkg != INSTAGRAM_PACKAGE) {
                      if (pkg == packageName) return
                      val lowerPkg = pkg.lowercase()
                      if (IGNORED_SYSTEM_PACKAGES.any { lowerPkg.contains(it) }) {
                          return
                      }
                      if (event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                          if (!isInstagramWindowCurrentlyOnScreen()) {
                              wasInstagramInForeground = false
                              exploreModeLockedOn = false
                              hideExploreBlackoutOverlay()
                              pendingClickDmInbox = false
                              mainHandler.removeCallbacks(dmClickRetryRunnable)
                          }
                      }
                      return
                  }

                  val now = SystemClock.elapsedRealtime()

                  // 2. Detect fresh Instagram app open (Cold Start or Warm Resume from another app/launcher)
                  val justEnteredInstagram = !wasInstagramInForeground
                  wasInstagramInForeground = true

                  // 3. Check 15-Minute Active Usage Timer
                  if (checkAndEnforceFifteenMinuteLimit(now)) {
                      wasInstagramInForeground = false
                      exploreModeLockedOn = false
                      hideExploreBlackoutOverlay()
                      return
                  }

                  // If user just opened Instagram, immediately arm the 5-second DM redirect loop!
                  if (justEnteredInstagram) {
                      val root = getInstagramRootWindow()
                      if (root == null || !hasAnyVisibleNode(root, DM_SCREEN_IDS)) {
                          armPersistentDmRedirect(now, root)
                      }
                  }

                  val eventType = event.eventType

                  // 4. Handle Click, Selection & Focus Events immediately (0ms response time)
                  if (eventType == AccessibilityEvent.TYPE_VIEW_CLICKED ||
                      eventType == AccessibilityEvent.TYPE_VIEW_SELECTED ||
                      eventType == AccessibilityEvent.TYPE_VIEW_FOCUSED
                  ) {
                      if (handleDirectTabAndSearchClicks(event, now)) {
                          return
                      }
                  }

                  // 5. Handle Scroll Events inside DM Single-Reel Player
                  if (eventType == AccessibilityEvent.TYPE_VIEW_SCROLLED) {
                      if (inSingleReelSession) {
                          handleScrollDuringSingleReelSession(event, now)
                          return
                      } else {
                          val srcId = event.source?.viewIdResourceName ?: ""
                          if (srcId.contains("clips_viewer")) {
                              handleScrollDuringSingleReelSession(event, now)
                              return
                          }
                      }
                  }

                  // 6. Throttle high-frequency content events to save battery
                  if (eventType == AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) {
                      if (inSingleReelSession && !pendingClickDmInbox && (now - lastContentCheckAtMs < 380L)) {
                          return
                      }
                      if (now - lastContentCheckAtMs < CONTENT_EVENT_THROTTLE_MS) return
                      lastContentCheckAtMs = now
                  }

                  val root = getInstagramRootWindow() ?: return
                  evaluateScreenState(root, now)
              }

              /**
               * Finds the active Instagram application window even when our Explore Blackout Overlay
               * is currently displayed on top of Instagram.
               */
              private fun getInstagramRootWindow(): AccessibilityNodeInfo? {
                  val activeRoot = rootInActiveWindow
                  if (activeRoot != null && activeRoot.packageName?.toString() == INSTAGRAM_PACKAGE) {
                      return activeRoot
                  }
                  try {
                      val winList = windows
                      if (winList != null) {
                          for (win in winList) {
                              if (win.type == AccessibilityWindowInfo.TYPE_APPLICATION) {
                                  val r = win.root
                                  if (r != null && r.packageName?.toString() == INSTAGRAM_PACKAGE) {
                                      return r
                                  }
                              }
                          }
                      }
                  } catch (_: Throwable) {
                  }
                  return null
              }

              private fun isInstagramWindowCurrentlyOnScreen(): Boolean {
                  return getInstagramRootWindow() != null
              }

              private fun checkAndEnforceFifteenMinuteLimit(now: Long): Boolean {
                  if (now - lastTimerCloseAtMs < 3000L) return true

                  if (usageSessionStartAtMs == 0L || (now - lastInstaActivityAtMs) > SESSION_IDLE_RESET_MS) {
                      usageSessionStartAtMs = now
                      lastInstaActivityAtMs = now
                      return false
                  }

                  lastInstaActivityAtMs = now
                  if (now - usageSessionStartAtMs >= FIFTEEN_MINUTES_MS) {
                      usageSessionStartAtMs = 0L
                      lastInstaActivityAtMs = 0L
                      lastTimerCloseAtMs = now
                      resetSingleReelSession()
                      exploreModeLockedOn = false
                      hideExploreBlackoutOverlay()
                      Toast.makeText(
                          applicationContext,
                          "15 minutes on Instagram completed! Closing app.",
                          Toast.LENGTH_LONG
                      ).show()
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      return true
                  }
                  return false
              }

              /**
               * Handles clicks on the bottom navigation bar tabs (Explore, Home, Reels, Profile)
               * and the top Search bar with 0ms latency.
               */
              private fun handleDirectTabAndSearchClicks(event: AccessibilityEvent, now: Long): Boolean {
                  val src = event.source ?: return false
                  val viewId = findSelfOrParentViewId(src)
                  val contentDesc = findSelfOrParentContentDesc(src)
                  val className = event.className?.toString() ?: ""
                  val rect = Rect()
                  src.getBoundsInScreen(rect)
                  val metrics = resources.displayMetrics
                  val screenHeight = metrics.heightPixels
                  val screenWidth = metrics.widthPixels
                  val isBottomBarArea = rect.top >= (screenHeight * 0.84).toInt()
                  val centerX = rect.centerX()

                  // A. Did the user tap the Explore / Search tab on the bottom bar?
                  // Matches ID_EXPLORE_TAB, "Search and explore" description, OR the 2nd tab slot (20%-40% X) in bottom bar
                  val isExploreSlotTap = isBottomBarArea &&
                          event.eventType == AccessibilityEvent.TYPE_VIEW_CLICKED &&
                          centerX >= (screenWidth * 0.20).toInt() &&
                          centerX <= (screenWidth * 0.40).toInt() &&
                          viewId != ID_HOME_TAB && viewId != ID_REELS_TAB && viewId != ID_PROFILE_TAB

                  if (viewId == ID_EXPLORE_TAB ||
                      (isBottomBarArea && (contentDesc.contains("Search", ignoreCase = true) ||
                                           contentDesc.contains("Explore", ignoreCase = true))) ||
                      isExploreSlotTap
                  ) {
                      lastOrigin = ScreenOrigin.EXPLORE_PAGE
                      exploreModeLockedOn = true
                      searchTypingActiveUntilMs = 0L
                      pendingClickDmInbox = false
                      mainHandler.removeCallbacks(dmClickRetryRunnable)
                      resetSingleReelSession()
                      // Show the pure-black shield immediately at 0ms!
                      showOrUpdateExploreBlackoutOverlay(getInstagramRootWindow())
                      return true
                  }

                  // B. Did the user tap the Reels tab OR Home tab on the bottom bar? -> Redirect straight to DMs!
                  if (viewId == ID_REELS_TAB || viewId == ID_HOME_TAB ||
                      (isBottomBarArea && (contentDesc.equals("Reels", ignoreCase = true) ||
                                           contentDesc.equals("Home", ignoreCase = true) ||
                                           contentDesc.equals("Feed", ignoreCase = true)))
                  ) {
                      exploreModeLockedOn = false
                      hideExploreBlackoutOverlay()
                      armPersistentDmRedirect(now)
                      return true
                  }

                  // C. Did the user tap Profile or Creation tab on the bottom bar? -> Hide Explore overlay
                  if (viewId == ID_PROFILE_TAB || viewId == ID_CREATION_TAB ||
                      (isBottomBarArea && (contentDesc.contains("Profile", ignoreCase = true) ||
                                           contentDesc.contains("Create", ignoreCase = true)))
                  ) {
                      exploreModeLockedOn = false
                      hideExploreBlackoutOverlay()
                      return false
                  }

                  // D. Did the user tap the Top Search Bar while on Explore? -> Hide Blackout Shield to show search results!
                  if (viewId.contains("action_bar_search_edit_text") ||
                      viewId.contains("search_row") ||
                      className.contains("EditText", ignoreCase = true) ||
                      (exploreModeLockedOn && rect.bottom > 0 && rect.bottom <= (screenHeight * 0.17).toInt())
                  ) {
                      searchTypingActiveUntilMs = now + 3500L
                      hideExploreBlackoutOverlay()
                      return false
                  }

                  // E. Did the user tap a shared Reel inside a DM chat?
                  if (lastOrigin == ScreenOrigin.DM_CHAT_OR_INBOX &&
                      event.eventType == AccessibilityEvent.TYPE_VIEW_CLICKED &&
                      rect.bottom < (screenHeight * 0.88).toInt()
                  ) {
                      lastAllowedDmReelTapAtMs = now
                      lastBlockActionAtMs = 0L
                  }
                  return false
              }

              /**
               * Evaluates the active Instagram screen state.
               */
              private fun evaluateScreenState(root: AccessibilityNodeInfo, now: Long) {
                  // 1. If we are currently trying to enter DMs, attempt the click immediately
                  if (pendingClickDmInbox) {
                      if (now < pendingClickDmDeadlineMs) {
                          if (hasAnyVisibleNode(root, DM_SCREEN_IDS)) {
                              pendingClickDmInbox = false
                              exploreModeLockedOn = false
                              hideExploreBlackoutOverlay()
                              lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                              return
                          }
                          if (tryClickDmButtonComprehensive(root)) {
                              pendingClickDmInbox = false
                              exploreModeLockedOn = false
                              hideExploreBlackoutOverlay()
                              lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                              return
                          }
                      } else {
                          pendingClickDmInbox = false
                      }
                  }

                  val screenHeight = resources.displayMetrics.heightPixels
                  val isClipsFullscreen = isFullscreenClipsViewerVisible(root, screenHeight)
                  val isReelsTabSelected = isBottomTabSelected(root, ID_REELS_TAB)
                  val isExploreTabSelected = isBottomTabSelected(root, ID_EXPLORE_TAB) ||
                          hasAnyVisibleNode(root, EXPLORE_ONLY_SEARCH_BOX_IDS)
                  val isHomeTabSelected = isBottomTabSelected(root, ID_HOME_TAB)
                  val isProfileTabSelected = isBottomTabSelected(root, ID_PROFILE_TAB)
                  val isDmScreenVisible = hasAnyVisibleNode(root, DM_SCREEN_IDS)

                  // 2. User is inside DM Inbox or a Friend's DM Chat Thread
                  if (isDmScreenVisible && !isClipsFullscreen) {
                      pendingClickDmInbox = false
                      exploreModeLockedOn = false
                      hideExploreBlackoutOverlay()
                      lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                      resetSingleReelSession()
                      return
                  }

                  // 3. User is on the Explore / Search Tab
                  if ((isExploreTabSelected || exploreModeLockedOn) &&
                      !isClipsFullscreen && !isHomeTabSelected && !isReelsTabSelected && !isProfileTabSelected
                  ) {
                      lastOrigin = ScreenOrigin.EXPLORE_PAGE
                      exploreModeLockedOn = true
                      resetSingleReelSession()

                      if (isSearchTypingOrResultsActive(root, now)) {
                          hideExploreBlackoutOverlay()
                      } else {
                          showOrUpdateExploreBlackoutOverlay(root)
                      }
                      return
                  }

                  if (isHomeTabSelected || isReelsTabSelected || isProfileTabSelected) {
                      exploreModeLockedOn = false
                      hideExploreBlackoutOverlay()
                  }

                  // 4. Full-Screen Reel Viewer (ClipsViewer) is visible
                  if (isClipsFullscreen) {
                      exploreModeLockedOn = false
                      hideExploreBlackoutOverlay()

                      val recentlyTappedInDm = (now - lastAllowedDmReelTapAtMs) <= ALLOWED_TAP_WINDOW_MS
                      val allowedFromDm = (lastOrigin == ScreenOrigin.DM_CHAT_OR_INBOX || recentlyTappedInDm)

                      if (!allowedFromDm || (isReelsTabSelected && !inSingleReelSession && !recentlyTappedInDm)) {
                          armPersistentDmRedirect(now, root)
                          return
                      }

                      if (!inSingleReelSession) {
                          inSingleReelSession = true
                          singleReelOpenedAtMs = now
                          initialReelSignature = extractReelSignatureFast(root)
                          initialPagerIndex = -1
                      } else if (now - singleReelOpenedAtMs > INITIAL_REEL_SETTLE_GRACE_MS) {
                          val oldSig = initialReelSignature
                          val newSig = extractReelSignatureFast(root)
                          if (oldSig == null && newSig != null) {
                              initialReelSignature = newSig
                          } else if (oldSig != null && newSig != null && oldSig != newSig &&
                              !hasAnyVisibleNode(root, COMMENT_OR_SHEET_IDS)
                          ) {
                              resetSingleReelSession()
                              triggerBackAction(now)
                              return
                          }
                      }
                      return
                  }

                  // 5. Instant DM-Only Launch & Home/Reels Blocker:
                  // Whenever the Home Feed or Reels Tab is visible, immediately redirect to DM Inbox!
                  if (isHomeTabSelected || isReelsTabSelected || hasAnyVisibleNode(root, HOME_FEED_INDICATORS)) {
                      resetSingleReelSession()
                      armPersistentDmRedirect(now, root)
                      return
                  }
              }

              /**
               * Arms a persistent 5-second retry loop that clicks the DM button as soon as Instagram renders it,
               * guaranteeing 100% redirection on cold launch, warm resume, or tab switch.
               */
              private fun armPersistentDmRedirect(now: Long, rootNode: AccessibilityNodeInfo? = null) {
                  resetSingleReelSession()
                  lastAllowedDmReelTapAtMs = 0L
                  exploreModeLockedOn = false
                  hideExploreBlackoutOverlay()

                  val root = rootNode ?: getInstagramRootWindow()
                  if (root != null) {
                      if (tryClickDmButtonComprehensive(root)) {
                          pendingClickDmInbox = false
                          mainHandler.removeCallbacks(dmClickRetryRunnable)
                          lastOrigin = ScreenOrigin.DM_CHAT_OR_INBOX
                          return
                      }

                      val homeNode = root.findAccessibilityNodeInfosByViewId(ID_HOME_TAB)?.firstOrNull()
                      if (homeNode != null && !homeNode.isSelected) {
                          clickNodeOrParent(homeNode)
                      }
                  }

                  pendingClickDmInbox = true
                  pendingClickDmDeadlineMs = now + DM_REDIRECT_TIMEOUT_MS
                  mainHandler.removeCallbacks(dmClickRetryRunnable)
                  mainHandler.postDelayed(dmClickRetryRunnable, 100L)
              }

              /**
               * Multi-layer DM button detector that works across ALL Instagram versions:
               * Layer 1: Exact view IDs (action_bar_inbox_button, direct_tab, etc.)
               * Layer 2: Top-right position + contentDescription ("Direct", "Messenger", "message", "inbox")
               * Layer 3: Rightmost clickable icon in the top ActionBar when on the Home tab
               */
              private fun tryClickDmButtonComprehensive(root: AccessibilityNodeInfo): Boolean {
                  for (id in DM_BUTTON_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (node.isVisibleToUser && clickNodeOrParent(node)) {
                              return true
                          }
                      }
                  }

                  val metrics = resources.displayMetrics
                  val screenWidth = metrics.widthPixels
                  val screenHeight = metrics.heightPixels
                  val maxTopBarY = (screenHeight * 0.18).toInt()
                  val minRightX = (screenWidth * 0.65).toInt()
                  val rect = Rect()

                  var fallbackRightmostNode: AccessibilityNodeInfo? = null
                  var fallbackMaxRight = -1

                  val queue = ArrayDeque<AccessibilityNodeInfo>(65)
                  queue.add(root)
                  var visited = 0

                  while (queue.isNotEmpty() && visited < 65) {
                      val node = queue.removeFirst()
                      visited++

                      if (node.isVisibleToUser) {
                          node.getBoundsInScreen(rect)
                          if (rect.bottom in 1..maxTopBarY && rect.left >= minRightX) {
                              val desc = node.contentDescription?.toString() ?: ""
                              val id = node.viewIdResourceName ?: ""
                              if (desc.contains("Direct", ignoreCase = true) ||
                                  desc.contains("Messenger", ignoreCase = true) ||
                                  desc.contains("message", ignoreCase = true) ||
                                  desc.contains("inbox", ignoreCase = true) ||
                                  id.contains("inbox", ignoreCase = true) ||
                                  id.contains("direct", ignoreCase = true)
                              ) {
                                  if (clickNodeOrParent(node)) return true
                              }
                              if (node.isClickable && rect.right > fallbackMaxRight && rect.top >= getStatusBarHeightPx() - 10) {
                                  fallbackMaxRight = rect.right
                                  fallbackRightmostNode = node
                              }
                          }
                      }

                      val count = node.childCount
                      for (i in 0 until count) {
                          if (visited + queue.size >= 65) break
                          val child = node.getChild(i)
                          if (child != null) queue.add(child)
                      }
                  }

                  if (fallbackRightmostNode != null &&
                      (isBottomTabSelected(root, ID_HOME_TAB) || hasAnyVisibleNode(root, HOME_FEED_INDICATORS))
                  ) {
                      if (clickNodeOrParent(fallbackRightmostNode)) return true
                  }

                  return false
              }

              private fun isSearchTypingOrResultsActive(root: AccessibilityNodeInfo, now: Long): Boolean {
                  if (now < searchTypingActiveUntilMs) return true

                  val searchNodes = root.findAccessibilityNodeInfosByViewId("com.instagram.android:id/action_bar_search_edit_text")
                  if (searchNodes != null) {
                      for (node in searchNodes) {
                          if (!node.isVisibleToUser) continue
                          if (node.isFocused) return true
                          val txt = node.text?.toString()?.trim() ?: ""
                          if (txt.isNotEmpty() && !txt.equals("Search", ignoreCase = true)) {
                              return true
                          }
                      }
                  }

                  if (hasAnyVisibleNode(root, SEARCH_ACTIVE_INDICATORS)) {
                      return true
                  }
                  return false
              }

              /**
               * Places a solid, touch-absorbing pure black (#000000) shield over the middle Explore grid.
               * Consumes 100% of touch, drag, and scroll gestures inside the black region so the Explore
               * grid underneath is completely dead and unscrollable.
               */
              @SuppressLint("ClickableViewAccessibility")
              private fun showOrUpdateExploreBlackoutOverlay(root: AccessibilityNodeInfo?) {
                  val wm = windowManager ?: return
                  val metrics = resources.displayMetrics
                  val screenHeight = metrics.heightPixels
                  val rect = Rect()

                  var topEdgeY = -1
                  var bottomEdgeY = -1

                  if (root != null) {
                      for (id in EXPLORE_SEARCH_BAR_IDS) {
                          val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                          for (node in nodes) {
                              if (!node.isVisibleToUser) continue
                              node.getBoundsInScreen(rect)
                              if (rect.bottom > 0 && rect.bottom < (screenHeight * 0.28).toInt()) {
                                  if (rect.bottom > topEdgeY) topEdgeY = rect.bottom
                              }
                          }
                          if (topEdgeY > 0) break
                      }

                      val bottomBarIds = arrayOf(ID_TAB_BAR, ID_EXPLORE_TAB, ID_HOME_TAB, ID_REELS_TAB)
                      for (id in bottomBarIds) {
                          val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                          for (node in nodes) {
                              if (!node.isVisibleToUser) continue
                              node.getBoundsInScreen(rect)
                              if (rect.top > (screenHeight * 0.72).toInt()) {
                                  bottomEdgeY = rect.top
                                  break
                              }
                          }
                          if (bottomEdgeY > 0) break
                      }
                  }

                  if (topEdgeY <= 0) {
                      topEdgeY = if (lastOverlayTopY > 0) lastOverlayTopY else (getStatusBarHeightPx() + dpToPx(58f))
                  }
                  if (bottomEdgeY <= topEdgeY) {
                      bottomEdgeY = if (lastOverlayHeight > 0 && lastOverlayTopY > 0) {
                          lastOverlayTopY + lastOverlayHeight
                      } else {
                          screenHeight - getNavigationBarHeightPx() - dpToPx(52f)
                      }
                  }

                  val overlayHeight = (bottomEdgeY - topEdgeY).coerceAtLeast(dpToPx(200f))

                  if (exploreBlackoutView == null) {
                      val container = FrameLayout(this).apply {
                          setBackgroundColor(Color.BLACK)
                          isClickable = true
                          isLongClickable = true
                          isFocusable = false
                          // Consume 100% of DOWN, MOVE (scroll), and UP touch events so the Explore grid
                          // underneath cannot scroll, move, or respond to any gesture!
                          setOnTouchListener { _, _: MotionEvent -> true }
                      }
                      val label = TextView(this).apply {
                          text = "Explore Feed Blocked • Use Search Bar Above"
                          setTextColor(Color.parseColor("#3B424C"))
                          textSize = 13f
                          gravity = Gravity.CENTER
                      }
                      val lp = FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                      )
                      container.addView(label, lp)
                      exploreBlackoutView = container
                  }

                  if (exploreOverlayParams == null) {
                      exploreOverlayParams = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          overlayHeight,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                                  WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.OPAQUE
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = 0
                          y = topEdgeY
                      }
                  }

                  try {
                      if (!isExploreOverlayAdded) {
                          exploreOverlayParams!!.y = topEdgeY
                          exploreOverlayParams!!.height = overlayHeight
                          wm.addView(exploreBlackoutView, exploreOverlayParams)
                          isExploreOverlayAdded = true
                          lastOverlayTopY = topEdgeY
                          lastOverlayHeight = overlayHeight
                      } else if (kotlin.math.abs(lastOverlayTopY - topEdgeY) > 4 ||
                          kotlin.math.abs(lastOverlayHeight - overlayHeight) > 4
                      ) {
                          exploreOverlayParams!!.y = topEdgeY
                          exploreOverlayParams!!.height = overlayHeight
                          wm.updateViewLayout(exploreBlackoutView, exploreOverlayParams)
                          lastOverlayTopY = topEdgeY
                          lastOverlayHeight = overlayHeight
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun hideExploreBlackoutOverlay() {
                  if (!isExploreOverlayAdded) return
                  val wm = windowManager ?: return
                  val view = exploreBlackoutView ?: return
                  try {
                      wm.removeViewImmediate(view)
                  } catch (_: Throwable) {
                  } finally {
                      isExploreOverlayAdded = false
                  }
              }

              private fun findSelfOrParentViewId(node: AccessibilityNodeInfo): String {
                  var cur: AccessibilityNodeInfo? = node
                  var depth = 0
                  while (cur != null && depth < 4) {
                      val id = cur.viewIdResourceName
                      if (!id.isNullOrEmpty()) return id
                      cur = cur.parent
                      depth++
                  }
                  return ""
              }

              private fun findSelfOrParentContentDesc(node: AccessibilityNodeInfo): String {
                  var cur: AccessibilityNodeInfo? = node
                  var depth = 0
                  while (cur != null && depth < 4) {
                      val desc = cur.contentDescription?.toString()?.trim()
                      if (!desc.isNullOrEmpty()) return desc
                      cur = cur.parent
                      depth++
                  }
                  return ""
              }

              private fun dpToPx(dp: Float): Int {
                  return TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP,
                      dp,
                      resources.displayMetrics
                  ).toInt()
              }

              private fun getStatusBarHeightPx(): Int {
                  val resId = resources.getIdentifier("status_bar_height", "dimen", "android")
                  return if (resId > 0) resources.getDimensionPixelSize(resId) else dpToPx(32f)
              }

              private fun getNavigationBarHeightPx(): Int {
                  val resId = resources.getIdentifier("navigation_bar_height", "dimen", "android")
                  return if (resId > 0) resources.getDimensionPixelSize(resId) else dpToPx(42f)
              }

              private fun handleScrollDuringSingleReelSession(event: AccessibilityEvent, now: Long) {
                  if (!inSingleReelSession) {
                      if (lastOrigin == ScreenOrigin.DM_CHAT_OR_INBOX) {
                          inSingleReelSession = true
                          singleReelOpenedAtMs = now
                          initialPagerIndex = event.fromIndex
                      }
                      return
                  }

                  val elapsedSinceOpen = now - singleReelOpenedAtMs
                  val src = event.source
                  val viewId = src?.viewIdResourceName?.lowercase() ?: ""
                  val parentId = src?.parent?.viewIdResourceName?.lowercase() ?: ""
                  val className = event.className?.toString()?.lowercase() ?: ""

                  if (SAFE_SCROLL_HINTS.any { viewId.contains(it) || parentId.contains(it) }) {
                      return
                  }

                  val isPagerOrListScroll = viewId.contains("clips_viewer") ||
                          parentId.contains("clips_viewer") ||
                          viewId.contains("view_pager") ||
                          className.contains("viewpager") ||
                          className.contains("recyclerview")

                  if (!isPagerOrListScroll) return

                  val currentIndex = event.fromIndex

                  if (elapsedSinceOpen <= INITIAL_REEL_SETTLE_GRACE_MS) {
                      if (initialPagerIndex == -1 && currentIndex >= 0) {
                          initialPagerIndex = currentIndex
                      }
                      return
                  }

                  val root = getInstagramRootWindow()
                  if (root != null) {
                      if (hasAnyVisibleNode(root, COMMENT_OR_SHEET_IDS)) return
                      if (!isFullscreenClipsViewerVisible(root, resources.displayMetrics.heightPixels)) {
                          resetSingleReelSession()
                          return
                      }
                  }

                  val indexChanged = (initialPagerIndex >= 0 && currentIndex >= 0 && currentIndex != initialPagerIndex) ||
                          (currentIndex >= 1)

                  val deltaYScrolled = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      event.scrollDeltaY > 35 || event.scrollDeltaY < -35
                  } else {
                      event.scrollY > 0
                  }

                  val isDirectClipsPager = viewId.contains("clips_viewer") || parentId.contains("clips_viewer")

                  if (indexChanged || deltaYScrolled || isDirectClipsPager) {
                      resetSingleReelSession()
                      triggerBackAction(now)
                  }
              }

              private fun triggerBackAction(now: Long) {
                  if (now - lastBlockActionAtMs < ACTION_COOLDOWN_MS) return
                  lastBlockActionAtMs = now
                  lastAllowedDmReelTapAtMs = 0L
                  performGlobalAction(GLOBAL_ACTION_BACK)
              }

              private fun resetSingleReelSession() {
                  inSingleReelSession = false
                  singleReelOpenedAtMs = 0L
                  initialReelSignature = null
                  initialPagerIndex = -1
              }

              private fun isBottomTabSelected(root: AccessibilityNodeInfo, tabViewId: String): Boolean {
                  val nodes = root.findAccessibilityNodeInfosByViewId(tabViewId) ?: return false
                  return nodes.any { it.isSelected && it.isVisibleToUser }
              }

              private fun hasAnyVisibleNode(root: AccessibilityNodeInfo, viewIds: Array<String>): Boolean {
                  for (id in viewIds) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id)
                      if (nodes != null && nodes.any { it.isVisibleToUser }) {
                          return true
                      }
                  }
                  return false
              }

              private fun isFullscreenClipsViewerVisible(root: AccessibilityNodeInfo, screenHeight: Int): Boolean {
                  val rect = Rect()
                  val minFullscreenHeight = (screenHeight * 0.70).toInt()

                  for (id in CLIPS_VIEWER_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (!node.isVisibleToUser) continue
                          node.getBoundsInScreen(rect)
                          if (id == "com.instagram.android:id/clips_video_container") {
                              if (rect.height() >= minFullscreenHeight &&
                                  !hasAnyVisibleNode(root, HOME_FEED_INDICATORS)
                              ) {
                                  return true
                              }
                          } else if (rect.height() >= minFullscreenHeight ||
                              id == "com.instagram.android:id/clips_item_overlay_component"
                          ) {
                              return true
                          }
                      }
                  }
                  return false
              }

              private fun extractReelSignatureFast(root: AccessibilityNodeInfo): String? {
                  for (id in REEL_SIGNATURE_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId(id) ?: continue
                      for (node in nodes) {
                          if (!node.isVisibleToUser) continue
                          val txt = node.text?.toString()?.trim() ?: ""
                          if (txt.isNotEmpty()) return txt
                          val desc = node.contentDescription?.toString()?.trim() ?: ""
                          if (desc.isNotEmpty()) return desc
                      }
                  }
                  return null
              }

              private fun clickNodeOrParent(node: AccessibilityNodeInfo): Boolean {
                  var current: AccessibilityNodeInfo? = node
                  var depth = 0
                  while (current != null && depth < 4) {
                      if (current.isClickable) {
                          return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      }
                      current = current.parent
                      depth++
                  }
                  return false
              }

              override fun onInterrupt() {
                  wasInstagramInForeground = false
                  exploreModeLockedOn = false
                  hideExploreBlackoutOverlay()
                  resetSingleReelSession()
                  pendingClickDmInbox = false
                  mainHandler.removeCallbacks(dmClickRetryRunnable)
              }

              override fun onDestroy() {
                  isServiceCurrentlyRunning = false
                  wasInstagramInForeground = false
                  exploreModeLockedOn = false
                  hideExploreBlackoutOverlay()
                  resetSingleReelSession()
                  pendingClickDmInbox = false
                  mainHandler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
          EOF

