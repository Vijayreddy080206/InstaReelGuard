name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Unzip and Build APK
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z"
          done
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: InstaReelGuard_Android_Project.zip was not found in the repository!"
            ls -la
            exit 1
          fi
          cd "$(dirname "$SETTINGS_FILE")"
          gradle assembleRelease --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaReelGuard-APK
          path: '**/app-release.apk'
